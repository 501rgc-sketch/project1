// Максимум ресурса с учётом резерва двигателя
function getResourceMax(k, tpl, s) {
    if (!s || !s.ttx) return 0;
    if (k === 'energy') {
        var used = (s.engine ? s.engine.reserved : 0)
                 + (s.weaponsActive ? s.weapons.length : 0);
        return Math.max(0, s.ttx.energy_sys - used);
    }
    if (k === 'hull')   return s.ttx.hull;
    if (k === 'shields')return s.ttx.shields;
    if (k === 'fuel')   return s.ttx.fuel_cap;
    if (k === 'cargo')  return s.ttx.cargo_cap;
    return 0;
}

// Параметры двигателя — из таблицы engine_table
function getEngineParams(tpl, reserved) {
    var et = tpl.engine_table;
    if (!et || !et.entries || et.entries.length === 0) {
        return { speedTarget: 0, accel: 0, heatRate: 0 };
    }
    var idx = Math.max(0, Math.floor(reserved || 0));
    if (idx >= et.entries.length) idx = et.entries.length - 1;
    var e = et.entries[idx];
    return { speedTarget: e.speed, accel: e.accel, heatRate: e.heat };
}

// Цветовая зона (только для UI, не для механики)
function getEngineColorZone(tpl, reserved) {
    var em = tpl.engine_modes || { min: 1, orange_max: 1, yellow_max: 2, green_max: 3 };
    if (!reserved || reserved < em.min) return 'off';
    if (reserved <= em.orange_max) return 'orange';
    if (reserved <= em.yellow_max) return 'yellow';
    if (reserved <= em.green_max) return 'green';
    return 'blue';
}

function bindCardHandlers(s, tpl) {
    // Вкладки
    document.querySelectorAll('.ship-tab').forEach(function(el) {
        el.addEventListener('click', function() {
            window._shipTab = el.getAttribute('data-tab');
            render();
        });
    });

    // name / transponder — автосохранение
    var nameInp = document.getElementById('shipName');
    if (nameInp) {
        nameInp.addEventListener('change', function() {
            s.name = nameInp.value.trim();
            saveState(s);
            document.getElementById('shipTitle').innerHTML =
                tpl.icon + ' ' + (s.name || s.template) +
                ' <span class="ship-badge">' + tpl.subtitle + '</span>';
        });
    }
    var transpInp = document.getElementById('shipTransponder');
    if (transpInp) {
        transpInp.addEventListener('change', function() {
            s.transponder = transpInp.value.trim();
            saveState(s);
        });
    }

    // Резерв двигателя
    var engInp = document.getElementById('engineEnergyInput');
    if (engInp) {
        engInp.addEventListener('change', function() {
            var s2 = getState();
            if (!s2) return;
            if (!s2.engine) s2.engine = { reserved: 0, speed: 0, pendingReserved: null, pendingApplyAt: 0 };
            if (s2.engine.overheated) {
                engInp.value = s2.engine.pendingReserved !== null ? s2.engine.pendingReserved : s2.engine.reserved;
                return;
            }
            if (s2.damage && s2.damage.engine_critical) {
                engInp.value = s2.engine.pendingReserved !== null ? s2.engine.pendingReserved : s2.engine.reserved;
                return;
            }
            var available2 = s2.resources.energy + s2.engine.reserved;
            var oldFree = s2.resources.energy;
            var v = parseFloat(engInp.value);
            if (isNaN(v) || v < 0) v = 0;
            v = Math.round(v);
            if (v > available2) v = available2;

            // Сброс в 0 — мгновенно (стоп-кран)
            if (v === 0) {
                var oldReserved = s2.engine.reserved;
                s2.engine.reserved = 0;
                s2.engine.pendingReserved = null;
                s2.engine.pendingApplyAt = 0;
                s2.resources.energy += oldReserved;
                saveState(s2);
                render();
                return;
            }

            // Обрезка по available — обновить инпут, если игрок ввёл больше
            if (v > available2) {
                v = available2;
                engInp.value = v;
            }

            // Проверка DEAD: если после применения free станет 0
            var newFree = available2 - v;
            if (newFree === 0 && v > 0) {
                pendingReboot = true;
                engInp.value = s2.engine.reserved;
                s2.engine.pendingReserved = null;
                s2.engine.pendingApplyAt = 0;
                showAlert('dead');
                return;
            }

            // Обычное изменение — задержка 3–6 сек
            var et = tpl.engine_table;
            var dmin = (et && et.delay_min) || 3;
            var dmax = (et && et.delay_max) || 6;
            var delay = dmin + Math.random() * (dmax - dmin);

            s2.engine.pendingReserved = v;
            s2.engine.pendingApplyAt = Date.now() + delay * 1000;

            // WARN при пересечении порога (сработает в момент применения)
            if (oldFree >= tpl.crit_energy && newFree < tpl.crit_energy && newFree > 0) {
                setTimeout(function() { showAlert('warn'); }, delay * 1000);
            }

            saveState(s2);
            // НЕ render — инпут уже показывает введённое значение,
            // состояние применится через engineTick
        });
    }

    // Кнопки у полей
    ['energy','hull','shields','fuel','cargo'].forEach(function(k) {
        var btn = document.getElementById('resBtn_' + k);
        if (!btn) return;
        btn.addEventListener('click', function() { openResourceModal(k, s, tpl); });
    });

    // Допуски
    var addCodeBtn = document.getElementById('shipAddCode');
    if (addCodeBtn) {
        addCodeBtn.addEventListener('click', function() {
            var inp = document.getElementById('shipCodeInput');
            if (!inp) return;
            var code = inp.value.trim();
            if (!code) return;
            var match = CODES[code];
            if (match) {
                if (!s.clearances.some(function(c){ return c.id === match.id; })) {
                    s.clearances.push({ id: match.id, name: match.name });
                    saveState(s);
                    render();
                } else {
                    inp.value = '';
                    inp.placeholder = 'Этот допуск уже есть';
                }
            } else {
                inp.value = '';
                inp.placeholder = 'Код не распознан';
            }
        });
    }

    // Гиперпрыжок

// === АНИМАЦИЯ СКОРОСТИ ===
var engineTimer = null;
var pendingReboot = false;

function startEngineSimulation() {
    if (engineTimer) return;
    engineTimer = setInterval(engineTick, 100);
}

var _lastHeatTick = 0;

function engineTick() {
    var s = getState();
    if (!s) return;
    var tpl = TEMPLATES[s.template];
    if (!tpl) return;
    if (!s.engine) s.engine = { reserved: 0, speed: 0, pendingReserved: null, pendingApplyAt: 0 };
    if (s.engine.heat === undefined) s.engine.heat = 0;
    if (s.engine.overheated === undefined) s.engine.overheated = false;
    if (s.engine.pendingReserved === undefined) s.engine.pendingReserved = null;
    if (s.engine.pendingApplyAt === undefined) s.engine.pendingApplyAt = 0;
    if (s.stage !== 'card') return;

    // На станции всё замерло
    if (s.docked) return;

    // Во время гиперпрыжка движок не работает (судно «в гипере»)
    if (_hyperRunning) return;

    var changed = false;

    // Завершение активации оружия (15 сек)
    if (s.weaponsActivationEndAt > 0 && Date.now() >= s.weaponsActivationEndAt) {
        s.weaponsActive = true;
        s.weaponsActivationEndAt = 0;
        changed = true;
        saveState(s);
        render();
    }

    // Применение задержки: если пришло время — переключаем
    if (s.engine.pendingReserved !== null && Date.now() >= s.engine.pendingApplyAt) {
        var oldReserved = s.engine.reserved;
        var newReserved = s.engine.pendingReserved;
        s.engine.reserved = newReserved;
        s.resources.energy += oldReserved - newReserved;
        s.engine.pendingReserved = null;
        s.engine.pendingApplyAt = 0;
        changed = true;
    }

    // Появление щитов после задержки
    if (s.shieldState && s.shieldState.appearAt > 0 && Date.now() >= s.shieldState.appearAt) {
        s.resources.shields = s.shieldState.pendingShields;
        s.shieldState.appearAt = 0;
        s.shieldState.pendingShields = 0;
        changed = true;
        saveState(s);
        render();
    }
    // Снятие статуса «пробиты» когда истёк кулдаун
    if (s.shieldState && s.shieldState.pierced && s.shieldState.cooldownUntil <= Date.now()) {
        s.shieldState.pierced = false;
        saveState(s);
        render();
    }

    // Если перегрев — принудительно reserved = 0 (энергия возвращается в free)
    if (s.engine.overheated && s.engine.reserved > 0) {
        s.resources.energy += s.engine.reserved;
        s.engine.reserved = 0;
        s.engine.pendingReserved = null;
        s.engine.pendingApplyAt = 0;
        changed = true;
    }

    var params = getEngineParams(tpl, s.engine.reserved);
    var target = params.speedTarget;
    var effectiveAccel = params.accel;
    var manDecel = 0;

    // Манёвр: эффекты
    if (s.engine.maneuver) {
        var manNow = Date.now();
        var manElapsed = (manNow - s.engine.maneuver.startTime) / 1000;
        if (manElapsed >= s.engine.maneuver.duration) {
            s.engine.maneuver = null;
        } else {
            if (s.engine.maneuver.type === 'brake' || s.engine.maneuver.type === 'barrel') {
                manDecel = s.engine.maneuver.decelPerSec || 0;
            } else if (s.engine.maneuver.type === 'overdrive') {
                if (target === 0) {
                    target = s.ttx.max_space + s.engine.maneuver.maxBonus;
                    effectiveAccel = s.engine.maneuver.accelBonus;
                } else if (target >= (s.ttx.max_space - 0.01)) {
                    target = s.ttx.max_space + s.engine.maneuver.maxBonus;
                    effectiveAccel += s.engine.maneuver.accelBonus;
                } else {
                    effectiveAccel += s.engine.maneuver.accelBonus;
                }
            }
        }
    }

    // Модификаторы от критов
    if (s.damage && s.damage.engine_critical) {
        target = 0;
        effectiveAccel = 0;
        manDecel = 0;
        if (s.engine.reserved > 0) {
            s.resources.energy += s.engine.reserved;
            s.engine.reserved = 0;
            s.engine.pendingReserved = null;
            s.engine.pendingApplyAt = 0;
        }
    }
    if (s.damage && s.damage.engine_damaged) target *= 0.25;
    if (s.damage && s.damage.engine_partial) effectiveAccel *= 0.25;

    var diff = target - s.engine.speed;
    var delta = 0;

    // Brake: base + bonus при En 0
    var brakeBase = tpl.brake_accel || 50;
    var brakeRate = (s.engine.reserved === 0 && tpl.engine_table && tpl.engine_table.brake_bonus_zero)
        ? brakeBase + tpl.engine_table.brake_bonus_zero
        : brakeBase;

    if (Math.abs(diff) >= 0.01) {
        var rate = (diff < 0) ? brakeRate : effectiveAccel;
        var step = rate * 0.1;
        if (Math.abs(diff) <= step) {
            delta = diff;
        } else {
            delta = (diff > 0 ? 1 : -1) * step;
        }
    }

    if (manDecel > 0) delta -= manDecel * 0.1;

    var newSpeed = s.engine.speed + delta;
    newSpeed = Math.max(0, newSpeed);
    if (Math.abs(newSpeed - s.engine.speed) > 0.001) {
        s.engine.speed = newSpeed;
        changed = true;
    }

    // Физика перегрева — из таблицы (может быть отрицательным)
    var now = Date.now();
    var dt = _lastHeatTick ? Math.min(1, (now - _lastHeatTick) / 1000) : 0.1;
    _lastHeatTick = now;

    var heat = s.engine.heat || 0;
    var heatRate = params.heatRate;
    var wasOverheated = !!s.engine.overheated;

    if (heatRate > 0 && !wasOverheated) {
        heat += heatRate * dt;
    } else if (heatRate < 0) {
        heat += heatRate * dt;   // heatRate отрицательный → heat уменьшается
    }
    heat = Math.max(0, heat);

    if (!wasOverheated && heat >= 100) {
        s.engine.overheated = true;
    }
    if (wasOverheated && heat <= 0) {
        s.engine.overheated = false;
        heat = 0;
    }

    if (heat !== s.engine.heat) changed = true;
    s.engine.heat = heat;

    if (changed) {
        var spEl = document.getElementById('engineSpeed');
        if (spEl) {
            spEl.textContent = Math.round(s.engine.speed);
            var zone = getEngineColorZone(tpl, s.engine.reserved);
            if (zone === 'blue') spEl.classList.add('is-forsage');
            else spEl.classList.remove('is-forsage');
        }
        var spMini = document.getElementById('engineSpeedMini');
        if (spMini) spMini.textContent = Math.round(s.engine.speed);
        saveState(s);
    }

    updateHeatDOM(heat, getEngineColorZone(tpl, s.engine.reserved), s.engine.overheated);
    updateShieldCooldownDOM();
    updateManeuverCooldownDOM();

    if (wasOverheated !== s.engine.overheated) {
        saveState(s);
        render();
    }
}

function updateHeatDOM(heat, modeStr, overheated) {
    var block = document.getElementById('engineHeatBlock');
    if (!block) return;

    var shouldShow = (heat > 0) || (modeStr === 'green') || (modeStr === 'blue') || overheated;
    block.style.display = shouldShow ? 'block' : 'none';
    if (!shouldShow) return;

    var color;
    if (overheated) color = '#E53935';
    else if (heat >= 90) color = '#E53935';
    else if (heat >= 70) color = '#F97316';
    else if (heat >= 40) color = '#FBBF24';
    else color = '#22C55E';

    var fill = document.getElementById('engineHeatFill');
    if (fill) {
        fill.style.width = heat + '%';
        fill.style.background = color;
        fill.style.boxShadow = '0 0 10px ' + color;
        if (heat >= 70 || overheated) {
            fill.style.animation = 'engineHeatPulse 0.8s ease-in-out infinite';
        } else {
            fill.style.animation = '';
        }
    }

    var txt = document.getElementById('engineHeatStatus');
    if (txt) {
        if (overheated) {
            txt.textContent = 'ПЕРЕГРЕВ · ' + heat.toFixed(0) + '% · охлаждение';
            txt.style.color = '#E53935';
        } else if (heat >= 90) {
            txt.textContent = 'КРИТИЧЕСКИЙ НАГРЕВ · ' + heat.toFixed(1) + '%';
            txt.style.color = '#E53935';
        } else if (heat >= 70) {
            txt.textContent = 'ОПАСНЫЙ НАГРЕВ · ' + heat.toFixed(1) + '%';
            txt.style.color = '#F97316';
        } else if (heat > 0) {
            txt.textContent = heat.toFixed(1) + '%';
            txt.style.color = '#FBBF24';
        } else {
            txt.textContent = '0% · стабильно';
            txt.style.color = '#666';
        }
    }
}

// === МАНЁВРЫ ===
var _pendingCritAnimation = false;

function applyManeuver(type) {
    var s = getState();
    if (!s) return;
    var tpl = TEMPLATES[s.template];
    var man = tpl.maneuvers;
    if (!man) return;
    var m = man[type];
    if (!m) return;

    if (s.engine.overheated) return;
    if (s.damage && s.damage.engine_critical) return;
    if (s.engine.maneuverCooldownUntil > Date.now()) return;
    if (s.engine.speed < man.min_speed) return;

    // Энергия (овердрайв): если не хватает — сбрасываем в 0, эффекта нет, кулдаун стартует
    if (m.energy > 0 && s.resources.energy < m.energy) {
        s.resources.energy = 0;
        s.engine.maneuverCooldownUntil = Date.now() + 15000;
        saveState(s);
        render();
        return;
    }

    // Мгновенные эффекты
    if (m.energy > 0) s.resources.energy -= m.energy;
    if (type === 'evade') {
        s.engine.speed = Math.max(0, s.engine.speed - m.speedLoss);
    }
    s.engine.heat = s.engine.heat + m.heat;
    if (s.engine.heat >= 100) s.engine.overheated = true;

    // Активный манёвр (для тех, у кого duration > 0)
    if (m.duration > 0) {
        var data = { type: type, startTime: Date.now(), duration: m.duration };
        if (type === 'brake' || type === 'barrel') {
            data.decelPerSec = m.totalSpeedLoss / m.duration;
        } else if (type === 'overdrive') {
            data.accelBonus = m.accelBonus;
            data.maxBonus = m.maxBonus;
        }
        s.engine.maneuver = data;
    }

    // Кулдаун
    s.engine.maneuverCooldownUntil = Date.now() + 15000;

    triggerManeuverFx(type);

    saveState(s);
    render();
}

function triggerManeuverFx(type) {
    var box = document.getElementById('shipBox');
    if (!box) return;
    var cls = 'fx-' + type;
    box.classList.remove('fx-evade', 'fx-brake', 'fx-barrel', 'fx-overdrive');
    void box.offsetWidth;
    box.classList.add(cls);
    setTimeout(function() { box.classList.remove(cls); }, 1600);
}

function updateManeuverCooldownDOM() {
    var s = getState();
    if (!s || !s.engine) return;
    var left = Math.max(0, Math.ceil((s.engine.maneuverCooldownUntil - Date.now()) / 1000));
    var btnIds = ['maneuverEvade', 'maneuverBrake', 'maneuverBarrel', 'maneuverOverdrive'];
    btnIds.forEach(function(id) {
        var btn = document.getElementById(id);
        if (!btn) return;
        var cd = btn.querySelector('.maneuver-cd');
        if (cd) cd.textContent = left > 0 ? (left + 'с') : '';
    });

    // Только что истёк — перерерить кнопки (disabled снять)
    if (left === 0 && s.engine.maneuverCooldownUntil > 0) {
        s.engine.maneuverCooldownUntil = 0;
        saveState(s);
        render();
    }
}

var CRIT_POOL = [
    'hyperdrive', 'engine_critical', 'fuel_tanks', 'power_system',
    'sensors', 'weapons', 'life_support', 'deflectors',
    'engine_damaged', 'hull_breach', 'engine_partial'
];

var CRIT_LABELS = {
    hyperdrive:      '🌌 Гиперпривод',
    engine_critical: '🔥 Критическое повреждение двигателя',
    fuel_tanks:      '⛽ Повреждение баков',
    power_system:    '⚡ Повреждение энергоустановки',
    sensors:         '📡 Повреждение сенсоров',
    weapons:         '⚔️ Повреждение вооружения',
    life_support:    '💨 Повреждение жизнеобеспечения',
    deflectors:      '💠 Повреждение дефлекторов',
    engine_damaged:  '🚀 Повреждение двигателя',
    hull_breach:     '💥 Частичная разгерметизация',
    engine_partial:  '⚙️ Частичное повреждение двигателя'
};

var CRIT_DESCR = {

    fuel_tanks:      'Топливо 0 · при выпадении +20% урона от макс. корпуса',

    hull_breach:     'При выпадении +40% урона от макс. корпуса',
    engine_partial:  'Максимальное ускорение −75%'
};

function emptyDamageState() {
    var o = {};
    CRIT_POOL.forEach(function(k) { o[k] = false; });
    return o;
}

function applyDamage(amount) {
    var s = getState();
    if (!s || s.stage !== 'card' || s.destroyed) return;
    amount = Math.max(0, Math.round(amount));
    if (amount === 0) return;

    var toShields = Math.min(amount, s.resources.shields);
    var hadShields = s.resources.shields;
    s.resources.shields -= toShields;
    var toHull = amount - toShields;

    // Триггер пробития: были щиты > 0, урон их снёс до 0
    if (toShields > 0 && hadShields > 0 && s.resources.shields === 0 && s.shieldState && !s.shieldState.pierced) {
        s.shieldState.pierced = true;
        s.shieldState.cooldownUntil = Date.now() + 300000;
        s.shieldState.mode = 'off';
        s.shieldState.appearAt = 0;
        s.shieldState.pendingShields = 0;
        showShipToast('⚠ ЩИТЫ ПРОБИТЫ');
        flashShieldBlock();
    }

    if (toHull > 0) {
        s.resources.hull = Math.max(0, s.resources.hull - toHull);

        if (s.resources.hull === 0) {
            s.destroyed = true;
            saveState(s);
            render();
            return;
        }

        var hullPctAfter = s.resources.hull / s.ttx.hull;

        // 60% — гарантированные 2 крита (один раз)
        if (!s.damageThresholds.hit60 && hullPctAfter <= 0.60) {
            s.damageThresholds.hit60 = true;
            rollCrits(s, 2);
        }

        // 40% — гарантированные 3 крита (один раз)
        if (!s.destroyed && !s.damageThresholds.hit40 && hullPctAfter <= 0.40) {
            s.damageThresholds.hit40 = true;
            rollCrits(s, 3);
        }

        // 80% — 15% шанс на каждый удар
        if (!s.destroyed && hullPctAfter <= 0.80) {
            if (Math.random() < 0.15) rollCrits(s, 1);
        }

        if (s.resources.hull === 0) {
            s.destroyed = true;
        }
    }

    saveState(s);
    render();
}

function rollCrits(s, count) {
    if (!s || !s.damage) return;
    for (var i = 0; i < count; i++) {
        var active = Object.keys(s.damage).filter(function(k){ return s.damage[k]; });
        var available = CRIT_POOL.filter(function(k){ return active.indexOf(k) === -1; });
        if (available.length === 0) break;
        var picked = available[Math.floor(Math.random() * available.length)];
        applyCrit(s, picked);
        if (s.destroyed) return;
    }
}

function applyCrit(s, key) {
    if (!s || !s.damage) return;
    if (!s.damage[key]) _pendingCritAnimation = true;
    s.damage[key] = true;

    if (key === 'fuel_tanks') {
        s.resources.fuel = 0;
        var d1 = Math.round(s.ttx.hull * 0.20);
        s.resources.hull = Math.max(0, s.resources.hull - d1);
        if (s.resources.hull === 0) s.destroyed = true;
    } else if (key === 'hull_breach') {
        var d2 = Math.round(s.ttx.hull * 0.40);
        s.resources.hull = Math.max(0, s.resources.hull - d2);
        if (s.resources.hull === 0) s.destroyed = true;
    } else if (key === 'power_system') {
        var drain = Math.round(s.ttx.energy_sys * 0.60);
        s.resources.energy = Math.max(0, s.resources.energy - drain);
    } else if (key === 'engine_critical') {
        if (s.engine && s.engine.reserved > 0) {
            s.resources.energy += s.engine.reserved;
            s.engine.reserved = 0;
        }
    } else if (key === 'deflectors') {
        if (s.shieldState) {
            s.shieldState.mode = 'off';
            s.resources.shields = 0;
        }
    }
    // saveState здесь НЕ вызываем — сохраняет applyDamage в конце
}

function repairCrit(key) {
    var s = getState();
    if (!s || !s.damage) return;
    s.damage[key] = false;
    saveState(s);
    render();
}

// === ЩИТЫ ===
var SHIELD_COOLDOWN_MS = 180000;

function applyShieldMode(mode) {
    var s = getState();
    if (!s) return;
    if (s.damage && s.damage.deflectors) {
        alert('Дефлекторные щиты повреждены. Требуется ремонт.');
        return;
    }
    var tpl = TEMPLATES[s.template];
    if (!s.shieldState) s.shieldState = { mode: 'off', cooldownUntil: 0, manualValue: 0, pierced: false, appearAt: 0, pendingShields: 0 };

    if (mode === 'off') {
        s.shieldState.mode = 'off';
        s.resources.shields = 0;
        s.shieldState.appearAt = 0;
        s.shieldState.pendingShields = 0;
        saveState(s);
        render();
        return;
    }

    if (s.shieldState.cooldownUntil > Date.now()) return;

    var modes = tpl.shield_modes || {};
    var m = modes[mode];
    if (!m) return;

    if (s.resources.energy < m.energy) {
        alert('Недостаточно энергии: нужно ' + m.energy + ', доступно ' + s.resources.energy);
        return;
    }

    s.resources.energy -= m.energy;
    s.shieldState.mode = mode;
    s.shieldState.cooldownUntil = Date.now() + SHIELD_COOLDOWN_MS;
    // Задержка появления щитов 10–30 сек
    s.shieldState.pendingShields = Math.min(m.shields, s.ttx.shields);
    s.shieldState.appearAt = Date.now() + (10000 + Math.random() * 20000);
    s.shieldState.pierced = false;
    // Текущие щиты сбрасываются до появления новых
    s.resources.shields = 0;

    saveState(s);
    render();
}

function applyShieldManual() {
    var s = getState();
    if (!s) return;
    if (s.damage && s.damage.deflectors) {
        alert('Дефлекторные щиты повреждены. Требуется ремонт.');
        return;
    }
    if (!s.shieldState) s.shieldState = { mode: 'off', cooldownUntil: 0, manualValue: 0, pierced: false, appearAt: 0, pendingShields: 0 };

    if (s.shieldState.cooldownUntil > Date.now()) return;

    var inp = document.getElementById('shieldManualInput');
    if (!inp) return;
    var v = parseFloat(inp.value);
    if (isNaN(v) || v < 0) { alert('Введите число ≥ 0'); return; }
    v = Math.round(v);

    var maxSh = s.ttx.shields;
    var free = s.resources.energy;
    var cap = Math.min(free, maxSh);

    if (v > cap) {
        alert('Слишком много: максимум ' + cap + ' (энергия ' + free + ', щиты ' + maxSh + ')');
        return;
    }
    if (v < 1) {
        s.shieldState.mode = 'off';
        s.resources.shields = 0;
        s.shieldState.manualValue = 0;
        s.shieldState.appearAt = 0;
        s.shieldState.pendingShields = 0;
        saveState(s);
        render();
        return;
    }

    s.resources.energy -= v;
    s.shieldState.mode = 'manual';
    s.shieldState.manualValue = v;
    s.shieldState.cooldownUntil = Date.now() + SHIELD_COOLDOWN_MS;
    // Задержка появления 10–30 сек
    s.shieldState.pendingShields = v;
    s.shieldState.appearAt = Date.now() + (10000 + Math.random() * 20000);
    s.shieldState.pierced = false;
    s.resources.shields = 0;

    saveState(s);
    render();
}

function updateShieldCooldownDOM() {
    var s = getState();
    if (!s || !s.shieldState) return;
    var disp = document.getElementById('shieldCooldownDisplay');
    var block = document.getElementById('shieldCooldownBlock');
    if (!disp || !block) return;

    var left = Math.ceil((s.shieldState.cooldownUntil - Date.now()) / 1000);
    var pierced = !!s.shieldState.pierced;
    if (left > 0) {
        block.style.display = 'block';
        var m = Math.floor(left / 60);
        var sec = left % 60;
        var timeText = m + ':' + (sec < 10 ? '0' : '') + sec;
        if (pierced) {
            disp.innerHTML = 'Щиты перегружены · восстановление через ' + timeText;
            disp.style.color = '#E53935';
        } else {
            disp.textContent = 'Перезарядка: ' + timeText;
            disp.style.color = '#FBBF24';
        }
    } else {
        block.style.display = 'none';
        document.querySelectorAll('.shield-mode-btn').forEach(function(b) {
            if (b.getAttribute('data-shield-mode') !== 'off') b.disabled = false;
        });
        var ma = document.getElementById('shieldManualApply');
        if (ma) ma.disabled = false;
        var mi = document.getElementById('shieldManualInput');
        if (mi) mi.disabled = false;
    }
}

function updateHudDOM(s) {
    var hud = document.getElementById('shipHud');
    if (!hud) return;
    if (!s || s.stage !== 'card') { hud.style.display = 'none'; return; }
    hud.style.display = 'flex';

    function setBar(id, val, max) {
        var el = document.getElementById(id);
        if (!el) return;
        var pct = max > 0 ? Math.min(100, (val / max) * 100) : 0;
        var oldRaw = el.dataset.val;
        var oldVal = oldRaw ? parseFloat(oldRaw) : -1;
        if (oldVal !== -1 && Math.abs(oldVal - val) > 0.01) {
            el.classList.remove('flash');
            void el.offsetWidth;
            el.classList.add('flash');
        }
        el.style.width = pct + '%';
        el.dataset.val = val;
    }

    setBar('hudEnergyFill',  s.resources.energy,  s.ttx.energy_sys);
    setBar('hudHullFill',    s.resources.hull,    s.ttx.hull);
    setBar('hudShieldsFill', s.resources.shields, s.ttx.shields);
}

function updateLamp(s, tpl) {
    var lamp = document.getElementById('shipLamp');
    var box = document.getElementById('shipBox');
    var energy = s.resources.energy;
    box.classList.remove('ship-warn', 'ship-dead');
    lamp.classList.remove('warn', 'dead');
    if (energy === 0) {
        box.classList.add('ship-dead');
        lamp.classList.add('dead');
    } else if (energy < tpl.crit_energy) {
        box.classList.add('ship-warn');
        lamp.classList.add('warn');
    }

    // Перегрев — красная мигающая лампа
    var heatLamp = document.getElementById('heatLamp');
    if (heatLamp) {
        heatLamp.classList.remove('warn', 'dead');
        if (s.engine && s.engine.overheated) heatLamp.classList.add('dead');
    }

    // Критические повреждения — оранжевая мигающая лампа
    var critLamp = document.getElementById('critLamp');
    if (critLamp) {
        critLamp.classList.remove('warn', 'dead');
        if (s.damage) {
            var hasCrit = Object.keys(s.damage).some(function(k){ return s.damage[k]; });
            if (hasCrit) critLamp.classList.add('warn');
        }
    }
}

function startHyperDelay(s, tpl, dist, sys) {
    var navClass = s.ttx.nav_class;
    var totalSec = NAV_SEC[navClass] || 30;
    var totalMs = totalSec * 1000;

    var errChance = { 'C': 0.15, 'D': 0.25, 'E': 0.40, 'F': 0.60 }[navClass] || 0;
    var hasError = Math.random() < errChance;
    var errorAtMs = hasError ? Math.floor(totalMs * (0.10 + 0.85 * Math.random())) : Infinity;

    var STAGE_PCTS = [10, 40, 65, 85, 100];

    var startTime = Date.now();
    var lastStageIdx = -1;
    var errorFired = false;
    var energyChecked = false;

    renderHyperRunning();

    var tick = setInterval(function() {
        var elapsed = Date.now() - startTime;
        var pct = Math.min(100, (elapsed / totalMs) * 100);

        var stageIdx = 0;
        for (var i = 0; i < STAGE_PCTS.length; i++) {
            stageIdx = i;
            if (pct < STAGE_PCTS[i]) break;
        }

        // Ошибка
        if (hasError && !errorFired && elapsed >= errorAtMs) {
            errorFired = true;
            clearInterval(tick);
            _hyperRunning = null;
            showHyperError(HYPER_ERR_TITLES[stageIdx], HYPER_ERR_DESCS[stageIdx], pct, sys, dist, tpl);
            return;
        }

        // Конец этапа 4: проверка энергии и топлива
        if (!energyChecked && pct >= 85) {
            energyChecked = true;
            if (s.resources.energy < tpl.hyper_energy) {
                clearInterval(tick);
                _hyperRunning = null;
                showHyperError('НЕДОСТАТОК МОЩНОСТИ', 'Гипердвигатель не набрал мощность: недостаточно энергии.', pct, sys, dist, tpl);
                return;
            }
            if (s.resources.fuel < dist) {
                clearInterval(tick);
                _hyperRunning = null;
                showHyperError('НЕДОСТАТОК ТОПЛИВА', 'Недостаточно топлива для прыжка на ' + dist + ' пк.', pct, sys, dist, tpl);
                return;
            }
        }

        var fill = document.getElementById('hyperProgressFill');
        if (fill) fill.style.width = pct + '%';
        var pctEl = document.getElementById('hyperProgressPct');
        if (pctEl) pctEl.textContent = Math.round(pct) + '%';

        for (var j = 0; j < 5; j++) {
            var dot = document.getElementById('hyperDot' + j);
            if (!dot) continue;
            dot.classList.remove('done', 'active');
            if (j < stageIdx) dot.classList.add('done');
            else if (j === stageIdx) dot.classList.add('active');
        }

        if (stageIdx !== lastStageIdx) {
            lastStageIdx = stageIdx;
            renderHyperStage(stageIdx, sys, dist, tpl);
        }

        // Динамика по этапам
        if (stageIdx === 0) {
            var sp = (pct / 10) * 100;
            for (var k = 0; k < 3; k++) {
                var row = document.getElementById('hck' + k);
                if (row && sp >= (k + 1) * 33) {
                    row.classList.add('done');
                    var st = row.querySelector('.chk-status');
                    if (st) st.textContent = '✓';
                }
            }
        } else if (stageIdx === 1) {
            var mtx = document.getElementById('hyperMatrix');
            if (mtx) mtx.innerHTML = generateHyperCoords();
        } else if (stageIdx === 2) {
            var sp2 = ((pct - 40) / 25) * 100;
            document.querySelectorAll('.hyper-corner').forEach(function(c, idx) {
                if (sp2 >= (idx + 1) * 25) c.classList.add('locked');
            });
        } else if (stageIdx === 3) {
            var sp3 = Math.max(0, Math.min(100, ((pct - 65) / 20) * 100));
            var cf = document.getElementById('hyperChargeFill');
            var cl = document.getElementById('hyperChargeLabel');
            if (cf) {
                cf.style.width = sp3 + '%';
                if (sp3 >= 50) cf.classList.add('high');
            }
            if (cl) cl.textContent = Math.round(sp3) + '%';
        }

        // Успех
        if (elapsed >= totalMs) {
            clearInterval(tick);
            _hyperRunning = null;
            var arrBtn = document.getElementById('hyperArriveBtn');
            if (arrBtn) {
                arrBtn.disabled = false;
                arrBtn.textContent = '✅ Отправиться в систему';
            }
        }
    }, 80);

    _hyperRunning = { dist: dist, sys: sys, tpl: tpl, tick: tick };
}

// Сброс систем для полёта / стыковки:
// скорость → 0, резерв → 0, щиты выкл, оружие выкл.
// Резервированная энергия и стоимость оружия возвращаются в свободную.
function resetShipSystems() {
    var s = getState();
    if (!s) return;
    if (!s.engine) s.engine = { reserved: 0, speed: 0 };

    var oldReserved = s.engine.reserved || 0;
    s.engine.reserved = 0;
    s.engine.pendingReserved = null;
    s.engine.pendingApplyAt = 0;
    s.engine.speed = 0;
    s.engine.maneuver = null;
    s.resources.energy += oldReserved;

    // Оружие — выключить, вернуть энергию
    if (s.weaponsActive) {
        s.resources.energy += s.weapons.length;
        s.weaponsActive = false;
    }
    s.weaponsActivationEndAt = 0;

    // Щиты — выключить, обнулить
    if (s.shieldState) {
        s.shieldState.mode = 'off';
        s.shieldState.appearAt = 0;
        s.shieldState.pendingShields = 0;
    }
    s.resources.shields = 0;

    // Энергия не должна превышать максимум
    if (s.ttx) {
        s.resources.energy = Math.min(s.resources.energy, s.ttx.energy_sys);
    }

    saveState(s);
}

function onHyperArrive(sys, dist, tpl) {
    if (_hyperRunning && _hyperRunning.tick) clearInterval(_hyperRunning.tick);
    // _hyperRunning НЕ обнуляем — engineTick будет заблокирован во время warp
    document.getElementById('shipHyperOverlay').classList.remove('visible');

    // Сброс скорости / щитов / оружия — момент полёта
    resetShipSystems();

    playWarpEffect(function() {
        _hyperRunning = null;   // теперь engineTick снова работает

        var s2 = getState();
        var tpl2 = TEMPLATES[s2.template];
        var req = tpl2.hyper_energy;
        var mn = Math.floor(req * 0.85);
        var mx = Math.ceil(req * 1.15);
        var consumed = mn + Math.floor(Math.random() * (mx - mn + 1));
        s2.resources.energy = Math.max(0, s2.resources.energy - consumed);
        s2.resources.fuel = Math.max(0, s2.resources.fuel - dist);
        saveState(s2);

        if (s2.resources.energy === 0 && s2.engine && s2.engine.reserved > 0) {
            pendingReboot = true;
            showAlert('dead');
            return;
        }
        render();
        // Новая система — новые звёзды на фоне
        createShipStars();
        if (s2.resources.energy === 0) {
            showAlert('dead');
        } else if (s2.resources.energy < tpl2.crit_energy) {
            showAlert('warn');
        }
    });
}

function showAlert(type) {
    var ov = document.getElementById('shipAlertOverlay');
    // Сброс анимации — чтобы перезапустилась
    ov.classList.remove('visible', 'ship-alert-warn', 'ship-alert-dead');
    void ov.offsetWidth;
    ov.classList.add(type === 'dead' ? 'ship-alert-dead' : 'ship-alert-warn');
    ov.classList.add('visible');

// === WARP-ЭФФЕКТ ===
function playWarpEffect(callback) {
    var ov = document.getElementById('warpOverlay');
    var stars = document.getElementById('warpStars');
    var textEl = ov.querySelector('.warp-text');
    stars.innerHTML = '';
    var count = 220;
    for (var i = 0; i < count; i++) {
        var ang = (i / count) * 360 + (Math.random() * 8 - 4);
        var el = document.createElement('div');
        el.className = 'warp-star';
        el.style.setProperty('--a', ang + 'deg');
        el.style.animationDelay = (Math.random() * 0.5) + 's';
        stars.appendChild(el);
    }

    // Фаза 1: подготовка
    textEl.textContent = 'ПОДГОТОВКА';
    ov.classList.add('visible', 'preparing');

    // Фаза 2: прыжок
    setTimeout(function() {
        ov.classList.remove('preparing');
        textEl.textContent = 'ПРЫЖОК';
        // Перезапустить анимацию текста с нуля
        textEl.style.animation = 'none';
        void textEl.offsetWidth;
        textEl.style.animation = '';
    }, 1500);

    // Конец (1.5 + 4.5 = 6 сек)
    setTimeout(function() {
        ov.classList.remove('visible');
        if (callback) callback();
    }, 6000);
}

// === БОРТОВОЙ ЖУРНАЛ ===
var JOURNAL_KEY = 'galaxy_player_journal';

function loadJournal() {
    try { return JSON.parse(localStorage.getItem(JOURNAL_KEY) || '[]'); }
    catch(e) { return []; }
}
function saveJournal(j) {
    try { localStorage.setItem(JOURNAL_KEY, JSON.stringify(j)); } catch(e) {}
}
function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, function(c) {
        return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c];
    });
}
function renderJournal() {
    var list = document.getElementById('journalList');
    if (!list) return;
    var entries = loadJournal();
    if (!entries.length) {
        list.innerHTML = '<div class="ship-clearance-empty">— записей пока нет —</div>';
        return;
    }
    list.innerHTML = entries.map(function(e) {
        return '<div class="journal-entry">' +
            '<div class="journal-entry-text">' + escapeHtml(e.text) + '</div>' +
            '<div class="journal-entry-foot">' +
            '<span>' + e.time + '</span>' +
            '<span class="journal-entry-del" data-jdel="' + e.id + '">🗑 Удалить</span>' +
            '</div></div>';
    }).join('');

    list.querySelectorAll('[data-jdel]').forEach(function(el) {
        el.addEventListener('click', function() {
            var id = parseInt(el.getAttribute('data-jdel'), 10);
            var arr = loadJournal().filter(function(x) { return x.id !== id; });
            saveJournal(arr);
            renderJournal();
        });
    });
}
function addJournalEntry() {
    var inp = document.getElementById('journalInput');
    if (!inp) return;
    var text = inp.value.trim();
    if (!text) return;
    var arr = loadJournal();
    arr.unshift({
        id: Date.now(),
        text: text,
        time: new Date().toLocaleString('ru-RU')
    });
    saveJournal(arr);
    inp.value = '';
    renderJournal();
}

// === АНИМИРОВАННЫЙ ФОН ===
function createShipStars() {
    var container = document.getElementById('shipStars');
    if (!container) return;
    // Удаляем старые звёзды
    container.querySelectorAll('.ship-star').forEach(function(el) { el.remove(); });

    var starCount = 14;
    for (var i = 0; i < starCount; i++) {
        var el = document.createElement('div');
        el.className = 'ship-star';
        var size = Math.random() < 0.3 ? 3 : 2;
        el.style.width = size + 'px';
        el.style.height = size + 'px';
        el.style.left = (5 + Math.random() * 90) + '%';
        el.style.top = (5 + Math.random() * 90) + '%';
        el.style.opacity = (0.4 + Math.random() * 0.5).toFixed(2);
        var dx = (Math.random() * 120 - 60).toFixed(0) + 'px';
        var dy = (Math.random() * 120 - 60).toFixed(0) + 'px';
        el.style.setProperty('--dx', dx);
        el.style.setProperty('--dy', dy);
        el.style.animationDuration = (45 + Math.random() * 45).toFixed(1) + 's';
        el.style.animationDelay = '-' + (Math.random() * 30).toFixed(1) + 's';
        container.appendChild(el);
    }
}

function initShipStars() {
    createShipStars();
}

// === ИНИЦИАЛИЗАЦИЯ ===
function init() {
    var btn = document.getElementById('shipBtn');
    var ov = document.getElementById('shipOverlay');
    var close = document.getElementById('shipClose');

    btn.addEventListener('click', function() {
        ov.classList.add('visible');
        editMode = false;
        render();
    });
    close.addEventListener('click', function() {
        if (_hyperRunning) return;
        ov.classList.remove('visible');
    });

    document.getElementById('shipMiniApply').addEventListener('click', applyResourceModal);
    document.getElementById('shipMiniCancel').addEventListener('click', closeResourceModal);
    document.getElementById('shipMiniInput').addEventListener('keydown', function(e) {
        if (e.key === 'Enter') { e.preventDefault(); applyResourceModal(); }
        if (e.key === 'Escape') { e.preventDefault(); closeResourceModal(); }
    });

    document.getElementById('shipAlertBtn').addEventListener('click', function() {
        document.getElementById('shipAlertOverlay').classList.remove('visible');
        if (pendingReboot) {
            var s = getState();
            if (s) {
                if (!s.engine) s.engine = { reserved: 0, speed: 0 };
                if (!s.shieldState) s.shieldState = { mode: 'off', cooldownUntil: 0, manualValue: 0 };
                s.resources.energy = s.resources.energy + s.engine.reserved;
                s.engine.reserved = 0;
                s.resources.shields = 0;
                s.shieldState.mode = 'off';
                saveState(s);
                render();
            }
            pendingReboot = false;
        }
    });

    // === ОВЕРЛЕЙ ВНЕШНИХ ВОЗДЕЙСТВИЙ ===
    var dmgBtn   = document.getElementById('damageBtn');
    var dmgOv    = document.getElementById('damageOverlay');
    var dmgClose = document.getElementById('damageClose');

    function refreshDamageInfo() {
        var s = getState();
        var blk = document.getElementById('damageInfoBlock');
        if (!s || !blk) return;
        var sh = Math.round(s.resources.shields);
        var hu = Math.round(s.resources.hull);
        var maxSh = s.ttx.shields;
        var maxHu = s.ttx.hull;
        var active = s.damage ? CRIT_POOL.filter(function(k){ return s.damage[k]; }) : [];
        var html = 'Щиты: <b style="color:#A78BFA;">' + sh + ' / ' + maxSh + '</b><br>';
        html += 'Корпус: <b style="color:#F57C00;">' + hu + ' / ' + maxHu + '</b><br>';
        if (active.length) {
            html += 'Криты: <b style="color:#FF8888;">' + active.length + '</b>';
        } else {
            html += 'Криты: <span style="color:#666;">—</span>';
        }
        blk.innerHTML = html;
    }

    dmgBtn.addEventListener('click', function() {
        dmgOv.classList.add('visible');
        refreshDamageInfo();
    });
    dmgClose.addEventListener('click', function() {
        dmgOv.classList.remove('visible');
    });
    document.getElementById('damage1Btn').addEventListener('click', function() {
        applyDamage(1);
        refreshDamageInfo();
    });
    document.getElementById('damageApplyBtn').addEventListener('click', function() {
        var inp = document.getElementById('damageCustomInput');
        var v = parseFloat(inp.value);
        if (isNaN(v) || v < 1) { alert('Введите число ≥ 1'); return; }
        applyDamage(Math.round(v));
        inp.value = '';
        refreshDamageInfo();
    });

    // === ПЕРЕСБОРКА ПОСЛЕ УНИЧТОЖЕНИЯ ===
    document.getElementById('destroyedRestartBtn').addEventListener('click', function() {
        document.getElementById('destroyedOverlay').classList.remove('visible');
        clearState();
        window._shipTab = 'main';
        render();
    });

    // Автооткрытие при загрузке
    ov.classList.add('visible');
    editMode = false;
    render();

    // Запуск симуляции двигателя
    startEngineSimulation();

    // Анимированный фон
    initShipStars();
}

function showDestroyedAlert() {
    var ov = document.getElementById('destroyedOverlay');
    ov.classList.remove('visible');
    void ov.offsetWidth;
    ov.classList.add('visible');
}

if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', function() { setTimeout(init, 1500); });
} else {
    setTimeout(init, 1500);
}
})();
</script>
