            if (!wpn || typeof wpn === 'string') return;
            var st = getWeaponStats(wpn.type);
            var acc = wpn._acc || 0;
            var hasShot = acc >= st.cooldown;
            var hasAmmoOk = !st.hasAmmo || (wpn.ammo || 0) > 0;
            var hasEnergy = s.resources.energy >= st.energy;
            var canUse = canControlWeapon(s, wpn.type);
            var aimBlocked = c.maneuvers && c.maneuvers.active && c.maneuvers.active.type === 'aim';
            var canFire = hasShot && hasAmmoOk && hasEnergy && canUse && !aimBlocked;

            var borderColor = aimBlocked ? '#888' : (canFire ? '#50DC78' : (hasShot ? '#E53935' : '#666'));
            html += '<div style="padding:8px 10px;background:rgba(0,0,0,0.3);border-left:3px solid ' + borderColor + ';border-radius:4px;margin-bottom:6px;">';
            html += '<div style="display:flex;align-items:center;gap:8px;margin-bottom:6px;">';
            html += '<span style="font-size:14px;">' + (st.hasAmmo ? '🚀' : '🎯') + '</span>';
            html += '<span style="flex:1;font-size:12px;color:#E8E8E8;">' + escapeHtml(wpn.type) + '</span>';
            html += '<span style="font-size:10px;font-family:monospace;color:#666;">' + st.energy + '⚡ · ' + st.cooldown + 'с</span>';
            html += '</div>';
            if (st.hasAmmo) {
                html += '<div style="font-size:11px;color:#999;font-family:monospace;margin-bottom:4px;">Боезапас: ' + (wpn.ammo || 0) + ' ' + st.ammoName + '</div>';
            }
            html += '<div style="display:flex;gap:6px;align-items:center;">';
            var btnStyle = canFire
                ? 'padding:8px 14px;font-size:11px;border-color:#50DC78;color:#50DC78;background:rgba(80,220,120,0.1);flex:1;'
                : 'padding:8px 14px;font-size:11px;opacity:0.4;cursor:not-allowed;flex:1;';
            html += '<button class="ship-btn-main" data-fire-idx="' + idx + '"' + (canFire ? '' : ' disabled') + ' style="' + btnStyle + '">';
            if (aimBlocked) html += 'ПРИЦЕЛИВАНИЕ';
            else if (!canUse) html += 'НЕТ СТРЕЛКА';
            else if (!hasShot) html += 'НАКОПЛЕНИЕ ' + acc.toFixed(1) + '/' + st.cooldown;
            else if (!hasAmmoOk) html += 'НЕТ БОЕЗАПАСА';
            else if (!hasEnergy) html += 'НУЖНО ' + st.energy + '⚡';
            else html += '🎯 ВЫСТРЕЛ';
            html += '</button>';
            html += '</div>';
            html += '</div>';
        });
        html += '<div style="color:#666;font-size:10px;text-align:center;margin-top:6px;font-style:italic;">1 клик = 1 выстрел. Вне дальности — промах.</div>';
    }
    html += '</div>';

    // === Упреждение ===
    html += '<div class="ship-block" data-lamp="' + (s.weaponsActive ? 'ok' : 'off') + '">';
    html += '<div class="ship-block-title">Упреждение</div>';
    html += '<input type="number" id="combatLeadInput" value="' + (c.playerLead || '') + '" placeholder="0" min="0" step="1" style="width:100%;padding:10px 12px;background:rgba(20,20,30,0.9);border:1px solid #FFD700;border-radius:6px;color:#FFD700;font-family:monospace;font-size:20px;text-align:center;outline:none;box-sizing:border-box;">';
    html += '<div style="color:#888;font-size:11px;margin-top:8px;font-style:italic;">Пустое поле = автопромах.</div>';
    html += '</div>';

    // === Покинуть бой (отдельно, ниже упреждения) ===
    html += '<div class="ship-block" style="border-left-color:#E53935;padding:10px 14px;">';
    html += '<button class="ship-btn-secondary" id="combatFlee" style="width:100%;border-color:#E53935;color:#FF8888;">🚪 Покинуть бой</button>';
    html += '</div>';

    // === Щиты ===
    if ((s.ttx.shields || 0) > 0) {
        html += '<div class="ship-block">';
        html += '<div class="ship-block-title">Щиты</div>';
        if (c.shieldsActivationTurnsLeft > 0) {
            html += '<div style="color:#FBBF24;font-size:13px;font-family:monospace;text-align:center;padding:8px;">💠 Активация... осталось: ' + c.shieldsActivationTurnsLeft + ' х. → +' + c.shieldsPendingShields + '💠</div>';
        } else if (s.resources.shields > 0) {
            html += '<div style="color:#A78BFA;font-size:15px;font-family:monospace;text-align:center;padding:8px;">💠 ' + Math.round(s.resources.shields) + ' / ' + s.ttx.shields + '</div>';
        } else if (c.shieldsRaiseUsed) {
            html += '<div style="color:#666;font-size:12px;font-style:italic;text-align:center;padding:8px;">Щиты недоступны (поднятие использовано).</div>';
        } else if (tpl.shield_modes) {
            var labels = { min: 'Минимальные', medium: 'Усиленные', max: 'Максимальные' };
            Object.keys(tpl.shield_modes).forEach(function (mode) {
                var m = tpl.shield_modes[mode];
                html += '<button class="ship-btn-main" data-shield-activate="' + mode + '" style="margin-bottom:6px;padding:10px;border-color:#8B5CF6;color:#C4B5FD;">' +
                    (labels[mode] || mode) + ' · ' + m.energy + '⚡ → ' + m.shields + '💠 (4 х.)' +
                    '</button>';
            });
        }
        html += '</div>';
    }

    html += '</div>'; // конец правой колонны

    html += '</div>'; // конец combat-grid

    return html;
}


function renderCard(s) {
    if (!s.engine) s.engine = { reserved: 0, speed: 0, heat: 0, overheated: false };
    if (s.engine.heat === undefined) s.engine.heat = 0;
    if (s.engine.overheated === undefined) s.engine.overheated = false;
    if (!s.shieldState) s.shieldState = { mode: 'off', cooldownUntil: 0, manualValue: 0 };

    var tpl = TEMPLATES[s.template];

    document.getElementById('shipTitle').innerHTML =
        tpl.icon + ' ' + (s.name || s.template) +
        ' <span class="ship-badge">' + tpl.subtitle + '</span>';

    if (s.combat && s.combat.active) {
        document.getElementById('shipBody').innerHTML = buildCombatTab(s, tpl);
        bindCombatHandlers(s, tpl);
        updateHudDOM(s);
        return;
    }

    var TABS_ROW1 = [
        {id: 'main',    label: 'Главная'},
        {id: 'ident',   label: 'Идентификация'},
        {id: 'engine',  label: 'Двигатель'},
        {id: 'config',  label: 'Конфигурация'},
        {id: 'hyper',   label: 'Прыжок'},
        {id: 'journal', label: 'Журнал'}
    ];
    var TABS_ROW2 = [];
    if (s.ttx.shields > 0 && !(s.damage && s.damage.deflectors)) {
        TABS_ROW2.push({id: 'shields', label: 'Щиты'});
    }
    TABS_ROW2.push({id: 'docking', label: 'Стыковка'});
    TABS_ROW2.push({id: 'weapons', label: 'Оружие'});
    TABS_ROW2.push({id: 'crew', label: 'Экипаж'});
    TABS_ROW2.push({id: 'combat_test', label: 'Бой'});

    var allIds = TABS_ROW1.map(function(x){return x.id;}).concat(TABS_ROW2.map(function(x){return x.id;}));
    var activeTab = window._shipTab || 'main';
    if (allIds.indexOf(activeTab) === -1) activeTab = 'main';

    var html = '';
    html += '<div class="ship-tabs">';
    TABS_ROW1.forEach(function(tb) {
        html += '<button class="ship-tab' + (tb.id === activeTab ? ' active' : '') +
            '" data-tab="' + tb.id + '">' + tb.label + '</button>';
    });
    html += '</div>';
    if (TABS_ROW2.length > 0) {
        html += '<div class="ship-tabs ship-tabs-row2">';
        TABS_ROW2.forEach(function(tb) {
            html += '<button class="ship-tab' + (tb.id === activeTab ? ' active' : '') +
                '" data-tab="' + tb.id + '">' + tb.label + '</button>';
        });
        html += '</div>';
    }

    if (activeTab === 'main')        html += buildMainTab(s, tpl);
    else if (activeTab === 'ident')  html += buildIdentTab(s, tpl);
    else if (activeTab === 'engine') html += buildEngineTab(s, tpl);
    else if (activeTab === 'config') html += buildConfigTab(s, tpl);
    else if (activeTab === 'hyper')  html += buildHyperTab(s, tpl);
    else if (activeTab === 'journal')html += buildJournalTab();
    else if (activeTab === 'shields')html += buildShieldsTab(s, tpl);
    else if (activeTab === 'weapons')html += buildWeaponsTab(s, tpl);
    else if (activeTab === 'docking')html += buildDockingTab(s, tpl);
    else if (activeTab === 'crew')   html += buildCrewTab(s, tpl);
    else if (activeTab === 'combat_test') html += buildCombatTestTab(s, tpl);

    updateSkin(s);
    var tabChanged = (window._lastShipTab !== activeTab);
    window._lastShipTab = activeTab;
    document.getElementById('shipBody').innerHTML = html;
    if (tabChanged) {
        var sb = document.getElementById('shipBody');
        sb.classList.remove('tab-changed');
        void sb.offsetWidth;
        sb.classList.add('tab-changed');
    }
    bindCardHandlers(s, tpl);
    if (activeTab === 'journal') renderJournal();
    updateLamp(s, tpl);
    updateHudDOM(s);
    _pendingCritAnimation = false;
}

// ── Вкладки: содержимое ──

function buildIdentTab(s, tpl) {
    var html = '<div class="ship-block">';
    html += '<div class="ship-block-title">Идентификация</div>';
    html += '<div class="ship-field"><span class="ship-field-label">Название</span>' +
        '<input type="text" id="shipName" value="' + (s.name || '') + '" placeholder="—"></div>';
    html += '<div class="ship-field"><span class="ship-field-label">Транспондер</span>' +
        '<input type="text" id="shipTransponder" value="' + (s.transponder || '') + '" placeholder="xxxx-xxxx-xxxx-xxxx"></div>';
    html += '</div>';

    html += '<div class="ship-block">';
    html += '<div class="ship-block-title">Допуски</div>';
    html += '<div class="ship-field">' +
        '<input type="text" id="shipCodeInput" placeholder="Введите код допуска">' +
        '<button class="ship-res-btn" id="shipAddCode">🔑 Ввести</button></div>';
    if (s.clearances.length) {
        html += '<div class="ship-clearance-list">' +
            s.clearances.map(function(c) {
                var st = getClrStyle(c.id);
                return '<div class="ship-clearance-item" style="color:' + st.c + ';">' +
                    '<span class="clr-id">' + c.id + '</span>' +
                    '<span class="clr-name">' + c.name + '</span>' +
                    '<span class="clr-tag">' + st.tag + '</span>' +
                    '</div>';
            }).join('') + '</div>';
    } else {
        html += '<div class="ship-clearance-empty">— нет допусков —</div>';
    }
    html += '</div>';
    return html;
}

function buildEngineTab(s, tpl) {
    var r = s.resources;
    var available = r.energy + s.engine.reserved;
    var zone = getEngineColorZone(tpl, s.engine.reserved);
    var heat = s.engine.heat || 0;
    var overheated = !!s.engine.overheated;

    var noPilot = !hasFirstPilot(s);
    var overload = isOverloaded(s);
    var blocked = overheated || noPilot || overload;
    var inpDisabledAttr = blocked ? ' disabled' : '';
    var inpOpacityStyle = blocked ? 'opacity:0.4;' : '';

    var html = '';

    if (noPilot) {
        html += '<div class="ship-block" data-lamp="danger" style="border-left-color:#E53935;">';
        html += '<div class="ship-block-title" style="color:#E53935;">⚠ Требуется первый пилот</div>';
        html += '<div style="color:#FF8888;font-size:12px;">Управление двигателем недоступно. Посадите первого пилота во вкладке «Экипаж».</div>';
        html += '</div>';
    }
    if (overload) {
        html += '<div class="ship-block" data-lamp="danger" style="border-left-color:#E53935;">';
        html += '<div class="ship-block-title" style="color:#E53935;">⚠ Перегруз</div>';
        html += '<div style="color:#FF8888;font-size:12px;">Корабль не может летать. Уменьшите груз.</div>';
        html += '</div>';
    }

    // Инпут — нейтральный золотой, без цветовых подсказок режима
    var upLamp = overheated ? 'danger' : (s.engine.reserved > 0 ? 'ok' : 'off');
    html += '<div class="ship-block" data-lamp="' + upLamp + '">';
    html += '<div class="ship-block-title">Управление двигателем</div>';
    html += '<div style="text-align:center;padding:20px 0 10px;">';
    html += '<div style="color:#888;font-size:11px;text-transform:uppercase;letter-spacing:2px;margin-bottom:14px;">Резерв мощности</div>';
    var inpDisplay = (s.engine.pendingReserved !== null && s.engine.pendingReserved !== undefined)
        ? s.engine.pendingReserved : s.engine.reserved;
    html += '<input type="number" id="engineEnergyInput" value="' + inpDisplay + '"' +
        ' min="0" max="' + available + '" step="1"' + inpDisabledAttr +
        ' style="width:140px;padding:14px 10px;font-size:36px;text-align:center;font-family:monospace;' +
        'background:rgba(20,20,30,0.9);border:2px solid #FFD700;border-radius:10px;' +
        'color:#FFD700;outline:none;box-shadow:0 0 20px rgba(255,215,0,0.2);' + inpOpacityStyle + '">';
    html += '<div style="color:#888;font-size:12px;margin-top:14px;">из <b style="color:#E8E8E8;">' + available + '</b> доступной</div>';
    html += '</div>';
    html += '</div>';

    // Текущая скорость — без цветовых подсказок
    html += '<div class="ship-block">';
    html += '<div class="ship-block-title">Текущая скорость</div>';
    html += '<div class="engine-display">' +
        '<div class="engine-speed" id="engineSpeedMini">' + Math.round(s.engine.speed) + '</div>' +
        '<div class="engine-speed-unit">G</div>' +
        '</div>';
    html += '</div>';

    // Перегрев — по-прежнему с цветом, это отдельная механика
    var showHeat = (heat > 0) || (zone === 'green') || (zone === 'blue') || overheated;
    var heatDisplay = showHeat ? '' : 'display:none;';

    var heatColor, heatText, heatTextColor;
    if (overheated) {
        heatColor = '#E53935'; heatText = 'ПЕРЕГРЕВ · ' + heat.toFixed(0) + '% · охлаждение'; heatTextColor = '#E53935';
    } else if (heat >= 90) {
        heatColor = '#E53935'; heatText = 'КРИТИЧЕСКИЙ НАГРЕВ · ' + heat.toFixed(1) + '%'; heatTextColor = '#E53935';
    } else if (heat >= 70) {
        heatColor = '#F97316'; heatText = 'ОПАСНЫЙ НАГРЕВ · ' + heat.toFixed(1) + '%'; heatTextColor = '#F97316';
    } else if (heat >= 40) {
        heatColor = '#FBBF24'; heatText = heat.toFixed(1) + '%'; heatTextColor = '#FBBF24';
    } else if (heat > 0) {
        heatColor = '#22C55E'; heatText = heat.toFixed(1) + '%'; heatTextColor = '#22C55E';
    } else {
        heatColor = '#22C55E'; heatText = '0% · стабильно'; heatTextColor = '#666';
    }

    var pulseAnim = (heat >= 70 || overheated) ? 'animation:engineHeatPulse 0.8s ease-in-out infinite;' : '';

    var heatLamp = overheated ? 'danger' : (heat >= 70 ? 'warn' : (heat >= 40 ? 'info' : 'ok'));
    html += '<div class="ship-block" id="engineHeatBlock" data-lamp="' + heatLamp + '" style="' + heatDisplay + '">';
    html += '<div class="ship-block-title">Перегрев двигателя</div>';
    html += '<div style="margin-bottom:8px;">';
    html += '<span id="engineHeatStatus" style="color:' + heatTextColor + ';font-size:12px;font-family:monospace;font-weight:bold;letter-spacing:0.5px;">' + heatText + '</span>';
    html += '</div>';
    html += '<div style="height:14px;background:#1a1a22;border:1px solid #333;border-radius:4px;overflow:hidden;">';
    html += '<div id="engineHeatFill" style="height:100%;width:' + heat + '%;background:' + heatColor + ';transition:width 0.15s linear;box-shadow:0 0 10px ' + heatColor + ';' + pulseAnim + '"></div>';
    html += '</div>';
    html += '</div>';

    // === МАНЁВРЫ ===
    var man = tpl.maneuvers;
    if (man) {
        var now = Date.now();
        var cdLeft = Math.max(0, Math.ceil((s.engine.maneuverCooldownUntil - now) / 1000));
        var inCd = cdLeft > 0;
        var engineCrit = s.damage && s.damage.engine_critical;
        var belowMin = s.engine.speed < man.min_speed;
        var baseDisabled = overheated || engineCrit || inCd || belowMin || noPilot || overload;
        var cdText = inCd ? (cdLeft + 'с') : '';

        var btnDefs = [
            { id: 'evade',     icon: '🎯', name: 'Уклонение' },
            { id: 'brake',     icon: '🛑', name: 'Торможение' },
            { id: 'barrel',    icon: '🌀', name: 'Бочка' },
        ];
        if (man.overdrive) {
            btnDefs.push({ id: 'overdrive', icon: '🔥', name: 'Овердрайв' });
        }

        var manLamp = inCd ? 'warn' : (belowMin || overheated ? 'off' : 'ok');
        html += '<div class="ship-block" data-lamp="' + manLamp + '">';
        html += '<div class="ship-block-title">Манёвры</div>';
        html += '<div class="maneuver-grid">';
        btnDefs.forEach(function(b) {
            var disAttr = baseDisabled ? ' disabled' : '';
            html += '<button class="ship-btn-main maneuver-btn" id="maneuver' + b.id.charAt(0).toUpperCase() + b.id.slice(1) + '" data-maneuver="' + b.id + '"' + disAttr + '>';
            html += '<div class="maneuver-btn-icon">' + b.icon + '</div>';
            html += '<div class="maneuver-btn-name">' + b.name + '</div>';
            html += '<div class="maneuver-cd">' + cdText + '</div>';
            html += '</button>';
        });
        html += '</div>';
        if (belowMin) {
            html += '<div style="color:#888;font-size:11px;font-style:italic;text-align:center;margin-top:8px;">Требуется скорость ≥ ' + man.min_speed + ' G</div>';
        }
        html += '</div>';
    }

    return html;
}

function buildConfigTab(s, tpl) {
    var t = s.ttx;
    var html = '';

    html += '<div class="ship-block">';
    html += '<div class="ship-block-title">Характеристики</div>';
    html += '<div class="ship-ttx-row"><span class="ship-ttx-label">Скорость в атмосфере</span><span class="ship-ttx-value">до ' + t.atmo_speed + ' км/ч</span></div>';
    html += '<div class="ship-ttx-row"><span class="ship-ttx-label">Max скорость в космосе</span><span class="ship-ttx-value">до ' + t.max_space + ' G</span></div>';
    html += '<div class="ship-ttx-row"><span class="ship-ttx-label">Средняя скорость</span><span class="ship-ttx-value">' + t.avg_space + ' G</span></div>';
    html += '<div class="ship-ttx-row"><span class="ship-ttx-label">Ускорение</span><span class="ship-ttx-value">' + t.accel + ' G/s</span></div>';
    html += '<div class="ship-ttx-row"><span class="ship-ttx-label">Маневренность</span><span class="ship-ttx-value">' + t.maneuver + ' AG</span></div>';
    html += '<div class="ship-ttx-row"><span class="ship-ttx-label">Щиты</span><span class="ship-ttx-value">' + t.shields + ' ед</span></div>';
    html += '<div class="ship-ttx-row"><span class="ship-ttx-label">Прочность</span><span class="ship-ttx-value">' + t.hull + ' ед</span></div>';
    html += '<div class="ship-ttx-row"><span class="ship-ttx-label">Экипаж</span><span class="ship-ttx-value">' + t.crew + ' пилота</span></div>';
    html += '<div class="ship-ttx-row"><span class="ship-ttx-label">Пассажиры</span><span class="ship-ttx-value">' + t.passengers + ' чел</span></div>';
    html += '<div class="ship-ttx-row"><span class="ship-ttx-label">Грузоподъёмность</span><span class="ship-ttx-value">' + t.cargo_cap + ' т</span></div>';
    html += '<div class="ship-ttx-row"><span class="ship-ttx-label">Грузовые отсеки</span><span class="ship-ttx-value">' + t.cargo_bays + '</span></div>';
    html += '<div class="ship-ttx-row"><span class="ship-ttx-label">Спасательные капсулы</span><span class="ship-ttx-value">' + t.escape_pods + '</span></div>';
    html += '<div class="ship-ttx-row"><span class="ship-ttx-label">Энергоустановка</span><span class="ship-ttx-value">' + t.energy_sys_name + ' (' + t.energy_sys + ' ед)</span></div>';
    html += '<div class="ship-ttx-row"><span class="ship-ttx-label">Класс навигации</span><span class="ship-ttx-value">' + t.nav_class + '</span></div>';
    html += '<div class="ship-ttx-row"><span class="ship-ttx-label">Класс сенсоров</span><span class="ship-ttx-value">' + t.sens_class + '</span></div>';
    html += '<div class="ship-ttx-row"><span class="ship-ttx-label">Класс гиперпривода</span><span class="ship-ttx-value">' + t.hyper_class + '</span></div>';
    html += '<div class="ship-ttx-row"><span class="ship-ttx-label">Дальность прыжка</span><span class="ship-ttx-value">до ' + t.hyper_range + ' пк</span></div>';
    html += '<div class="ship-ttx-row"><span class="ship-ttx-label">Топливо</span><span class="ship-ttx-value">' + t.fuel_cap + ' пк</span></div>';
    html += '<div class="ship-ttx-row"><span class="ship-ttx-label">Обслуживание</span><span class="ship-ttx-value">' + t.maintenance + ' кр/пк</span></div>';
    html += '</div>';

    html += '<div class="ship-block">';
    html += '<div class="ship-block-title">Оружие</div>';
    var weaponsBroken = s.damage && s.damage.weapons;
    if (weaponsBroken) {
        html += '<div style="color:#FF8888;font-size:12px;margin-bottom:8px;">❌ Оружие отключено (повреждение)</div>';
    }
    if (s.weapons.length) {
        html += s.weapons.map(function(w){
            var name = (typeof w === 'string') ? w : w.type;
            var style = weaponsBroken ? 'color:#666;text-decoration:line-through;' : '';
            return '<div class="ship-ttx-row"><span class="ship-ttx-value" style="' + style + '">• ' + escapeHtml(name) + '</span></div>';
        }).join('');
    } else {
        html += '<div class="ship-ttx-row"><span class="ship-ttx-value">—</span></div>';
    }
    html += '</div>';

    html += '<div class="ship-block">';
    html += '<div class="ship-block-title">Особые модификации</div>';
    if (s.custom_mods) {
        html += '<div style="color:#BBB;font-size:13px;white-space:pre-wrap;">' + s.custom_mods + '</div>';
    } else {
        html += '<div style="color:#666;font-size:12px;font-style:italic;">—</div>';

function buildWeaponsTab(s, tpl) {

    // === Блок статуса + активация ===

        '<div class="weapons-status-icon">⚔️</div>' +
        '<div class="weapons-status-label" style="color:' + status.color + ';">' + status.label + '</div>' +

        '</div>';

    var cost = s.weapons.length;
    var canActivate = (status.key === 'off') && !isEnergyCritical(s) && s.resources.energy >= cost;

    html += '<div class="ship-actions">';
    if (status.key === 'activating') {
        html += '<button class="ship-btn-main" disabled>⏳ Активация...</button>';
    } else if (status.key === 'active') {
        html += '<button class="ship-btn-main" id="weaponsDeactivateBtn" style="border-color:#EF4444;color:#EF4444;background:rgba(239,68,68,0.1);">⏸ Деактивировать</button>';
    } else {
        var disAttr = canActivate ? '' : ' disabled';

    }
    html += '</div>';
    html += '</div>';

    // === Общий залп ===
    var salvo = getReadySalvoWeapons(s);

    html += '<div class="ship-block weapon-salvo-block" data-lamp="' + salvoLamp + '">';
    html += '<div class="ship-block-title">Общий залп · готово: ' + salvo.weapons.length + '</div>';

    html += '</div>';

    // === Список оружия ===
    html += '<div class="ship-block">';
    html += '<div class="ship-block-title">Орудия</div>';

    s.weapons.forEach(function(wpn, idx) {
        if (!wpn) return;
        var st = getWeaponStats(wpn.type);
        var cdLeft = Math.max(0, (wpn.cooldownUntil || 0) - Date.now());
        var cdSec = cdLeft > 0 ? (Math.ceil(cdLeft / 100) / 10) : 0;
        var hasAmmoOk = !st.hasAmmo || (wpn.ammo || 0) > 0;
        var hasEnergy = s.resources.energy >= st.energy;
        var canUse = canControlWeapon(s, wpn.type);
        var isReady = (status.key === 'active') && cdLeft === 0 && hasAmmoOk && hasEnergy && canUse;

        var itemClass = 'weapon-item';
        if (!canUse) itemClass += ' noammo';
        else if (cdLeft > 0) itemClass += ' cooldown';
        else if (!hasAmmoOk) itemClass += ' noammo';
        else if (!hasEnergy) itemClass += ' noenergy';
        else if (isReady) itemClass += ' ready';

        var flash = (window._flashWeaponIdx === idx || window._flashWeaponIdx === 'all') ? ' firing' : '';

        html += '<div class="' + itemClass + '">';

        // Заголовок
        html += '<div class="weapon-item-head">';
        html += '<span class="weapon-item-icon">' + (st.hasAmmo ? '🚀' : '🎯') + '</span>';
        html += '<span class="weapon-item-name">' + escapeHtml(wpn.type) + '</span>';
        html += '<span class="weapon-item-stats">' + st.energy + '⚡ · КД ' + st.cooldown + 'с</span>';
        html += '</div>';

        // Боезапас
        if (st.hasAmmo) {
            html += '<div class="weapon-item-ammo">';
            html += 'Боезапас: <b>' + (wpn.ammo || 0) + '</b> ' + st.ammoName;
            html += ' · <button class="weapon-item-ammo-btn" data-ammo-idx="' + idx + '">Изменить</button>';
            html += '</div>';
        }

        // Кнопка выстрела + КД
        html += '<div class="weapon-item-foot">';
        var disBtn = isReady ? '' : ' disabled';
        html += '<button class="weapon-fire-btn' + flash + '" id="weapFire_' + idx + '" data-fire-idx="' + idx + '"' + disBtn + '>';
        if (status.key !== 'active') {
            html += '—';
        } else if (!canUse) {
            html += 'НЕТ СТРЕЛКА';
        } else if (cdLeft > 0) {
            html += 'ПЕРЕЗАРЯДКА';
        } else if (!hasAmmoOk) {
            html += 'НЕТ БОЕЗАПАСА';
        } else if (!hasEnergy) {
            html += 'НУЖНО ' + st.energy + '⚡';
        } else {
            html += 'ВЫСТРЕЛ';
        }
        html += '</button>';
        html += '<span class="weapon-cd-text" id="weapCD_' + idx + '">' + (cdSec > 0 ? cdSec.toFixed(1) + 'с' : '') + '</span>';
        html += '</div>';

        html += '</div>';
    });

    html += '</div>';

    window._flashWeaponIdx = null;

    return html;
}

function activateWeapons() {
    var s = getState();
    if (!s) return;
    if (s.docked) return;
    var status = getWeaponsStatus(s);
    if (status.key !== 'off') return;
    if (s.weapons.length === 0) return;
    if (isEnergyCritical(s)) return;

    var cost = s.weapons.length;
    if (s.resources.energy < cost) return;

    var tpl = TEMPLATES[s.template];
    if (roundEnergy(s.resources.energy - cost) < tpl.crit_energy) return;

    s.resources.energy = roundEnergy(s.resources.energy - cost);
    s.weaponsActivationEndAt = Date.now() + 15000;
    saveState(s);
    render();
}

function deactivateWeapons() {
    var s = getState();
    if (!s) return;
    if (!hasAnyGunner(s)) return;
    if (!s.weaponsActive) return;
    if (s.weaponsActivationEndAt > 0) return;

    var tpl = TEMPLATES[s.template];
    var maxE = tpl.ttx.energy_sys - (s.engine ? s.engine.reserved : 0);
    s.weaponsActive = false;
    s.resources.energy = Math.min(maxE, roundEnergy(s.resources.energy + s.weapons.length));
    saveState(s);
    render();
}

function fireWeapon(idx) {
    var s = getState();
    if (!s) return;
    var status = getWeaponsStatus(s);
    if (status.key !== 'active') return;

    var wpn = s.weapons[idx];
    if (!wpn) return;
    var st = getWeaponStats(wpn.type);

    if (!canControlWeapon(s, wpn.type)) return;
    if ((wpn.cooldownUntil || 0) > Date.now()) return;
    if (st.hasAmmo && (!wpn.ammo || wpn.ammo <= 0)) return;
    if (s.resources.energy < st.energy) return;

    s.resources.energy = roundEnergy(Math.max(0, s.resources.energy - st.energy));
    wpn.cooldownUntil = Date.now() + st.cooldown * 1000;
    if (st.hasAmmo) wpn.ammo = Math.max(0, (wpn.ammo || 0) - 1);

    if (s.resources.energy === 0) {
        s.weaponsActive = false;
        s.weaponsActivationEndAt = 0;
        pendingReboot = true;
        saveState(s);
        showAlert('dead');
        return;
    }

    window._flashWeaponIdx = idx;
    saveState(s);
    render();
}

function fireSalvo() {
    var s = getState();
    if (!s) return;
    var status = getWeaponsStatus(s);
    if (status.key !== 'active') return;

    var salvo = getReadySalvoWeapons(s);
    if (salvo.weapons.length === 0) return;
    if (s.resources.energy < salvo.totalCost) return;

    s.resources.energy = roundEnergy(Math.max(0, s.resources.energy - salvo.totalCost));
    var now = Date.now();
    salvo.weapons.forEach(function(wpn) {
        var st = getWeaponStats(wpn.type);
        wpn.cooldownUntil = now + st.cooldown * 1000;
    });

    if (s.resources.energy === 0) {
        s.weaponsActive = false;
        s.weaponsActivationEndAt = 0;
        pendingReboot = true;
        saveState(s);
        showAlert('dead');
        return;
    }

    window._flashWeaponIdx = 'all';
    saveState(s);
    render();
}

        var m = Math.floor(cooldownLeft / 60);

        html += 'Осталось: ' + m + ':' + (sec < 10 ? '0' : '') + sec;

    html += '</div>';

    // Кнопки режимов
    html += '<div class="ship-block">';
    html += '<div class="ship-block-title">Режимы</div>';

    // Выкл

        '⏻ Выключены' + (offActive ? ' · активно' : '') +

    // Фикс режимы
    if (modes) {

            min: 'background:rgba(139,92,246,0.2);border-color:#8B5CF6;color:#C4B5FD;',

        };

    html += '<div style="margin-top:8px;padding:12px;background:rgba(0,0,0,0.3);border:1px solid #555;border-radius:6px;' + (manualActive ? 'border-color:#8B5CF6;' : '') + '">';

    html += '</div>';

    html += '</div>';

    return html;
}

            '<div class="ship-block-title">Стыковка</div>' +
            '<div style="text-align:center;padding:20px 0;">' +
            '<div style="font-size:48px;margin-bottom:12px;">🛰</div>' +
            '<div style="color:#50DC78;font-family:Orbitron;font-size:14px;letter-spacing:2px;">ПРИСТЫКОВАН</div>' +
            '</div>' +
            '<button class="ship-btn-main" id="dockUndockBtn">🛫 Отстыковаться</button>' +
            '</div>';
    }

    if (!_docking) {
        var noPilot = !hasFirstPilot(s);
        var overload = isOverloaded(s);
        if (noPilot) {
            return '<div class="ship-block" data-lamp="danger" style="border-left-color:#E53935;">' +
                '<div class="ship-block-title" style="color:#E53935;">⚠ Требуется первый пилот</div>' +
                '<div style="color:#FF8888;font-size:12px;">Стыковка недоступна без пилота.</div>' +
                '</div>';
        }
        if (overload) {

                '<div class="ship-block-title" style="color:#E53935;">⚠ Перегруз</div>' +
                '<div style="color:#FF8888;font-size:12px;">Корабль не может маневрировать. Уменьшите груз.</div>' +
                '</div>';

        return '<div class="ship-block">' +
            '<div class="ship-block-title">Стыковка</div>' +
            '<div style="text-align:center;padding:20px 0 10px;">' +
            '<div style="font-size:48px;margin-bottom:12px;">🛰</div>' +
            '<div style="color:#CCC;font-size:13px;margin-bottom:20px;">Орбитальный терминал готов к приёму</div>' +
            '</div>' +
            '<button class="ship-btn-main" id="dockRequestBtn">🛰 Запросить посадку</button>' +

    if (_docking.stage === 'processing') {
        var el = Date.now() - _docking.startedAt;
        var pct0 = Math.min(100, (el / DOCKING_PROCESS_MS) * 100);
        return '<div class="ship-block">' +
            '<div class="ship-block-title">Стыковка</div>' +
            '<div style="text-align:center;padding:20px 0;">' +
            '<div style="font-size:36px;margin-bottom:12px;">📡</div>' +
            '<div style="color:#FFD700;font-family:Orbitron;font-size:12px;letter-spacing:1.5px;margin-bottom:16px;">ОБРАБОТКА ЗАПРОСА</div>' +
            '<div class="ship-hyper-bar" style="margin-bottom:8px;"><div class="ship-hyper-bar-fill" id="dockProgressFill" style="width:' + pct0 + '%;"></div></div>' +
            '<div style="color:#666;font-size:11px;font-family:monospace;" id="dockProgressPct">' + Math.round(pct0) + '%</div>' +
            '</div>' +
            '<button class="ship-btn-secondary" id="dockAbortBtn" style="width:100%;">✕ Прервать</button>' +
            '</div>';
    }

    if (_docking.stage === 'code') {
        var html = '<div class="ship-block">';
        html += '<div class="ship-block-title">Стыковка</div>';

        html += '</div>';
        if (_docking.codeError) {
            html += '<div style="color:#E53935;font-size:12px;text-align:center;margin-bottom:12px;">❌ В посадке отказано. Код не распознан.</div>';

    if (_docking.stage === 'config') {
        var html2 = '<div class="ship-block">';
        html2 += '<div class="ship-block-title">Стыковка</div>';
        html2 += '<div style="text-align:center;padding:10px 0 16px;">';
        html2 += '<div style="font-size:36px;margin-bottom:12px;">⚠</div>';
        html2 += '<div style="color:#FFD700;font-family:Orbitron;font-size:12px;letter-spacing:1.5px;margin-bottom:10px;">УСТАНОВИТЕ СТЫКОВОЧНЫЕ КОНФИГУРАЦИИ</div>';
        html2 += '<div style="color:#888;font-size:12px;">Убедитесь, что все системы готовы к стыковке.</div>';
        html2 += '</div>';
        if (_docking.configError) {
            html2 += '<div style="background:rgba(229,57,53,0.1);border-left:3px solid #E53935;padding:10px 14px;border-radius:4px;margin-bottom:12px;">';

        html2 += '<div style="margin-top:8px;"><button class="ship-btn-secondary" id="dockAbortBtn" style="width:100%;">✕ Прервать</button></div>';
        html2 += '</div>';
        return html2;
    }

    // === КАЛИБРОВКА ===
    if (_docking.stage === 'calib') {
        var c = _docking.calib;
        var names = { S: 'Стабилизация', T: 'Тяга', Z: 'Захват' };
        var allOk = (c.S >= 40 && c.S <= 60 && c.T >= 40 && c.T <= 60 && c.Z >= 40 && c.Z <= 60);

        var h = '<div class="ship-block">';
        h += '<div class="ship-block-title">Калибровка систем</div>';
        h += '<div style="color:#CCC;font-size:12px;margin-bottom:14px;">Установите стабилизацию, тягу и захват.</div>';

        ['S', 'T', 'Z'].forEach(function(k) {

            var inZone = (val >= 40 && val <= 60);

            h += '<div style="margin-bottom:14px;">';
            h += '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px;">';

        h += '</div>';
        return h;
    }

    // === РАСЧЁТ ИМПУЛЬСА ===
    if (_docking.stage === 'impulse') {
        var s2 = getState();
        var cargo = s2.resources.cargo;
        var kg = cargo > 0 ? Math.round(cargo * 1000) : 1;
        var speed = Math.round(s2.engine.speed);

            ? cargo + ' т (' + kg + ' кг)'

        var hi = '<div class="ship-block">';
        hi += '<div class="ship-block-title">Расчёт импульса</div>';
        hi += '<div style="background:rgba(0,0,0,0.3);border-left:3px solid var(--accent);padding:12px 14px;border-radius:4px;margin-bottom:14px;font-family:monospace;font-size:13px;line-height:1.8;">';

        hi += '</div>';
        hi += '<div class="ship-hyper-field">';
        hi += '<label>Ответ</label>';
        hi += '<input type="number" id="dockImpulseInput" placeholder="Введите значение" step="1">';
        hi += '</div>';
        if (_docking.impulseError) {
            hi += '<div style="color:#E53935;font-size:12px;text-align:center;margin-bottom:12px;">❌ Неверный расчёт. Проверьте формулу и попробуйте снова.</div>';
        }
        hi += '<button class="ship-btn-main" id="dockImpulseSubmit">✅ Подтвердить</button>';
        hi += '<div style="margin-top:8px;"><button class="ship-btn-secondary" id="dockAbortBtn" style="width:100%;">✕ Прервать</button></div>';
        hi += '</div>';
        return hi;
    }

    // === ПОРЯДОК ПРОЦЕДУР ===
    if (_docking.stage === 'order') {
        var ho = '<div class="ship-block">';
        ho += '<div class="ship-block-title">Порядок процедур</div>';
        ho += '<div style="color:#CCC;font-size:12px;margin-bottom:14px;">Расставьте процедуры в правильном порядке (1–5).</div>';
        _docking.procedures.forEach(function(p, i) {
            ho += '<div style="display:flex;align-items:center;gap:8px;margin-bottom:6px;">';
            ho += '<select data-order="' + i + '" style="width:54px;padding:5px;background:rgba(20,20,30,0.9);border:1px solid #555;border-radius:4px;color:#E8E8E8;font-family:inherit;font-size:13px;outline:none;">';
            ho += '<option value="0">—</option>';
            [1,2,3,4,5].forEach(function(n) {
                ho += '<option value="' + n + '"' + (p.assigned === n ? ' selected' : '') + '>' + n + '</option>';
            });
            ho += '</select>';
            ho += '<span style="flex:1;color:#CCC;font-size:13px;">' + p.text + '</span>';
            ho += '</div>';
        });
        if (_docking.orderError) {
            var msg = 'Порядок нарушен. Попробуйте снова.';
            if (_docking.orderError === 'unfilled') msg = 'Присвойте номер каждой процедуре.';
            else if (_docking.orderError === 'duplicate') msg = 'Каждый номер может использоваться только один раз.';
            ho += '<div style="color:#E53935;text-align:center;margin-top:12px;font-size:12px;">❌ ' + msg + '</div>';
        }
        ho += '<button class="ship-btn-main" id="dockOrderVerify" style="margin-top:14px;">✅ Проверить</button>';
        ho += '<div style="margin-top:8px;"><button class="ship-btn-secondary" id="dockAbortBtn" style="width:100%;">✕ Прервать</button></div>';
        ho += '</div>';
        return ho;
    }

    // === ФИНАЛЬНАЯ АНИМАЦИЯ ===
    if (_docking.stage === 'animation') {
        var el2 = Date.now() - _docking.animStartedAt;
        var pct2 = Math.min(100, (el2 / 3000) * 100);
        var phase = 'СБЛИЖЕНИЕ';
        if (pct2 >= 35 && pct2 < 70) phase = 'ЗАХВАТ';
        else if (pct2 >= 70) phase = 'СТЫКОВКА';
        var ha = '<div class="ship-block">';
        ha += '<div class="ship-block-title">Стыковка</div>';
        ha += '<div style="text-align:center;padding:30px 0;">';
        ha += '<div style="font-size:36px;margin-bottom:20px;letter-spacing:16px;color:var(--accent);">🚀 → 🛰</div>';
        ha += '<div style="color:#FFD700;font-family:Orbitron;font-size:14px;letter-spacing:3px;margin-bottom:18px;">' + phase + '</div>';
        ha += '<div class="ship-hyper-bar" style="margin-bottom:8px;"><div class="ship-hyper-bar-fill" id="dockAnimFill" style="width:' + pct2 + '%;"></div></div>';
        ha += '<div style="color:#666;font-size:11px;font-family:monospace;" id="dockAnimPct">' + Math.round(pct2) + '%</div>';
        ha += '</div>';
        ha += '</div>';
        return ha;
    }

    return '<div class="ship-block"><div class="ship-block-title">Стыковка</div><div style="color:#888;text-align:center;padding:20px;">Неизвестное состояние</div></div>';
}

function ensureDockingProgress() {
    if (!_docking) return;

    // Продолжение анимации
    if (_docking.stage === 'animation') {
        if (_docking.animTick) clearInterval(_docking.animTick);
        _docking.animTick = setInterval(function() {
            if (!_docking || _docking.stage !== 'animation') {
                if (_docking && _docking.animTick) clearInterval(_docking.animTick);
                return;
            }
            var el = Date.now() - _docking.animStartedAt;
            var pct = Math.min(100, (el / 3000) * 100);
            var fill = document.getElementById('dockAnimFill');
            if (fill) fill.style.width = pct + '%';
            var pctEl = document.getElementById('dockAnimPct');
            if (pctEl) pctEl.textContent = Math.round(pct) + '%';
        }, 60);
        return;
    }

    // Продолжение обработки запроса
    if (_docking.stage === 'processing') {
        var elapsed = Date.now() - _docking.startedAt;
        if (elapsed >= DOCKING_PROCESS_MS) {
            _docking.stage = 'code';
            _docking.codeError = false;
            render();
            return;
        }
        if (_docking.tick) clearInterval(_docking.tick);
        _docking.tick = setInterval(function() {
            if (!_docking || _docking.stage !== 'processing') {
                if (_docking && _docking.tick) clearInterval(_docking.tick);
                return;
            }
            var el = Date.now() - _docking.startedAt;
            var pct = Math.min(100, (el / DOCKING_PROCESS_MS) * 100);
            var fill = document.getElementById('dockProgressFill');
            if (fill) fill.style.width = pct + '%';
            var pctEl = document.getElementById('dockProgressPct');
            if (pctEl) pctEl.textContent = Math.round(pct) + '%';
            if (el >= DOCKING_PROCESS_MS) {
                clearInterval(_docking.tick);
                _docking.stage = 'code';
                _docking.codeError = false;
                render();
            }
        }, 50);
    }
}

function dockRequest() {
    _docking = { stage: 'processing', startedAt: Date.now(), codeError: false, configError: false, tick: null };
    render();
}

function dockAbort() {
    if (_docking && _docking.tick) clearInterval(_docking.tick);
    if (_docking && _docking.animTick) clearInterval(_docking.animTick);
    _docking = null;
    render();
}

function dockSubmitCode() {
    if (!_docking || _docking.stage !== 'code') return;
    var inp = document.getElementById('dockCodeInput');
    if (!inp) return;
    var code = inp.value.trim().toUpperCase();
    if (DOCKING_CODES.indexOf(code) !== -1) {
        _docking.stage = 'config';
        _docking.codeError = false;
        _docking.configError = false;
    } else {
        _docking.codeError = true;
    }
    render();
}

function dockSubmitReady() {
    var s = getState();
    if (!s) return;

    var ok = true;
    if (!hasFirstPilot(s)) ok = false;
    if (isOverloaded(s)) ok = false;
    if (s.engine.heat >= 50) ok = false;
    if (s.weaponsActive) ok = false;
    if (s.shieldState && s.shieldState.mode !== 'off') ok = false;
    if (s.engine.speed < 1 || s.engine.speed > 500) ok = false;

    if (!ok) {
        _docking.configError = true;
        render();
        return;
    }

    // Переход на этап 3 — калибровка
    _docking.stage = 'calib';
    _docking.calib = { S: 30, T: 50, Z: 70 };
    _docking.calibError = false;
    render();
}

function dockCalibAdjust(key, newVal) {
    if (!_docking || !_docking.calib) return;
    var c = _docking.calib;
    var delta = newVal - c[key];
    if (delta === 0) return;

    var others = ['S','T','Z'].filter(function(k){ return k !== key; });
    c[key] = newVal;
    others.forEach(function(k) {
        c[k] = Math.max(10, Math.min(90, c[k] - delta / 2));
    });

    // Восстановить сумму, если упёрлись в clamp
    var sum = c.S + c.T + c.Z;
    if (Math.abs(sum - 150) > 0.5) {
        c[key] = Math.max(10, Math.min(90, c[key] + (150 - sum)));
    }

    render();
}

function dockCalibVerify() {
    if (!_docking || _docking.stage !== 'calib') return;
    var c = _docking.calib;
    if (c.S >= 40 && c.S <= 60 && c.T >= 40 && c.T <= 60 && c.Z >= 40 && c.Z <= 60) {
        // Калибровка пройдена — к расчёту импульса
        _docking.stage = 'impulse';
        _docking.impulseError = false;
        render();
    }
}

function dockImpulseSubmit() {
    if (!_docking || _docking.stage !== 'impulse') return;
    var s = getState();
    if (!s) return;
    var cargo = s.resources.cargo;
    var kg = cargo > 0 ? Math.round(cargo * 1000) : 1;
    var speed = Math.round(s.engine.speed);
    var answer = kg * speed;

    var inp = document.getElementById('dockImpulseInput');
    if (!inp) return;
    var v = parseFloat(inp.value);
    if (isNaN(v)) { _docking.impulseError = true; render(); return; }

    if (Math.abs(v - answer) < 0.5) {
        // Импульс верный — к порядку процедур
        // Выбираем 5 случайных процедур из 10
        var pool = DOCKING_PROCEDURES.slice();
        for (var i = pool.length - 1; i > 0; i--) {
            var j = Math.floor(Math.random() * (i + 1));
            var t = pool[i]; pool[i] = pool[j]; pool[j] = t;
        }
        var selected = pool.slice(0, 5);

        // Правильный порядок по индексу в исходном пуле
        var sorted = selected.slice().sort(function(a, b) {
            return DOCKING_PROCEDURES.indexOf(a) - DOCKING_PROCEDURES.indexOf(b);
        });
        var correctOrder = {};
        sorted.forEach(function(text, idx) {
            correctOrder[text] = idx + 1;
        });

        // Перемешиваем для отображения
        for (var i2 = selected.length - 1; i2 > 0; i2--) {
            var j2 = Math.floor(Math.random() * (i2 + 1));
            var t2 = selected[i2]; selected[i2] = selected[j2]; selected[j2] = t2;
        }

        _docking.stage = 'order';
        _docking.procedures = selected.map(function(text) { return { text: text, assigned: 0 }; });
        _docking.correctOrder = correctOrder;
        _docking.orderError = null;
        render();
    } else {
        _docking.impulseError = true;
        render();
    }
}

function dockOrderVerify() {
    if (!_docking || _docking.stage !== 'order') return;

    var used = {};
    var allAssigned = true;
    var noDup = true;
    _docking.procedures.forEach(function(p) {
        if (!p.assigned) { allAssigned = false; return; }
        if (used[p.assigned]) noDup = false;
        used[p.assigned] = true;
    });

    if (!allAssigned) { _docking.orderError = 'unfilled'; render(); return; }
    if (!noDup)       { _docking.orderError = 'duplicate'; render(); return; }

    var ok = true;
    _docking.procedures.forEach(function(p) {
        if (p.assigned !== _docking.correctOrder[p.text]) ok = false;
    });

    if (!ok) {
        _docking.orderError = 'wrong';
        render();
        return;
    }

    // Успех — финальная анимация
    dockStartAnimation();
}

function dockStartAnimation() {
    if (!_docking) return;
    _docking.stage = 'animation';
    _docking.animStartedAt = Date.now();
    render();

    setTimeout(function() {
        if (!_docking || _docking.stage !== 'animation') return;
        if (_docking.animTick) clearInterval(_docking.animTick);
        var s = getState();
        if (!s) return;
        resetShipSystems();
        s.docked = true;
        saveState(s);
        _docking = null;
        render();
    }, 3000);
}

function undock() {
    var s = getState();
    if (!s) return;
    s.docked = false;
    saveState(s);
    render();
}

function getWeaponStats(type) {
    return WEAPON_STATS[type] || { energy: 0, cooldown: 1 };

function getCrewWeight(s) {
    var n = 0;
    (s.crew || []).forEach(function(c) { if (c) n++; });
    (s.passengers || []).forEach(function(p) { if (p) n++; });
    return n * 0.1;
}

function getWeaponAmmoWeight(s) {
    var w = 0;
    (s.weapons || []).forEach(function(wpn) {
        if (!wpn || typeof wpn === 'string') return;
        var st = getWeaponStats(wpn.type);
        if (st.hasAmmo && wpn.ammo) w += wpn.ammo * 0.05;
    });
    return w;
}

function getOccupiedWeight(s) {
    return roundCargo(getCrewWeight(s) + getWeaponAmmoWeight(s));
}

function getCargoFree(s) {
    return Math.max(0, roundCargo((s.resources.cargo || 0) - getOccupiedWeight(s)));
}
function getCargoCapFree(s) {
    return Math.max(0, roundCargo(s.ttx.cargo_cap - getOccupiedWeight(s)));
}

function isEnergyCritical(s) {
    var tpl = TEMPLATES[s.template];
    return tpl && s.resources.energy < tpl.crit_energy;
}

function getWeaponsStatus(s) {

    if (!hasAnyGunner(s))            return { key: 'no_pilot',    label: 'ТРЕБУЕТСЯ СТРЕЛОК',      color: '#FFD166' };

function getReadySalvoWeapons(s) {

    var tpl = ENEMY_TEMPLATES[enemyType];
    if (!tpl) return;

    count = Math.max(1, Math.min(5, count || 1));

    (s.weapons || []).forEach(function (wpn) {
        if (!wpn || typeof wpn === 'string') return;
        wpn._acc = 0;
        wpn.cooldownUntil = 0;
    });

    var _effSens = getEffectiveSensClass(s);

    var enemies = [];
    for (var i = 0; i < count; i++) {
        enemies.push({
            template: enemyType,
            icon: tpl.icon,
            hp: tpl.hp,
            hpMax: tpl.hp,
            shields: tpl.shields,
            shieldsMax: tpl.shields,
            maneuver: tpl.maneuver,

            speed: tpl.speed,
            baseSpeed: tpl.speed,
            optimal_dist: tpl.optimal_dist || 1000,
            baseOptimalDist: tpl.baseOptimalDist || tpl.optimal_dist || 1000,
            sensorSpeed: getSensorSpeed(tpl.speed, _effSens),
            weapons: tpl.weapons.map(function (w) {
                return { type: w.type, _acc: 0 };
            }),
            afterburn: tpl.afterburn ? JSON.parse(JSON.stringify(tpl.afterburn)) : null,
            _afterburnRemaining: 0,
            _afterburnCdRemaining: 0,

        });

    var range = getSensRange(_effSens);
    var min = range[0], max = range[1];
    var initDist = min + Math.floor(Math.random() * (max - min + 1));

    s.combat = {
        active: true,

        activeTarget: 0,

    if (err === 3) return 0.25;

}

    evade:     '🎯 Уклонение',

    cool:      '🌡 Сброс тепла',

function getManeuverCost(templateKey, type) {
    if (type === 'evade')     return { heat: 0,  energy: 0,  speedLoss: (templateKey === 'GX1' ? 400 : templateKey === 'HWK-290' ? 800 : 300) };
    if (type === 'barrel') {
        var h = templateKey === 'GX1' ? 10 : templateKey === 'HWK-290' ? 15 : 5;
        var e = templateKey === 'GX1' ? 5  : templateKey === 'HWK-290' ? 15 : 10;
        var s = templateKey === 'GX1' ? 300 : templateKey === 'HWK-290' ? 1200 : 600;
        return { heat: h, energy: e, speedLoss: s };
    }
    if (type === 'rush')      return { heat: 15, energy: 15, speedLoss: 0 };
    if (type === 'cool') {
        var ce = templateKey === 'GX1' ? 5 : templateKey === 'HWK-290' ? 15 : 40;
        return { heat: -40, energy: ce, speedLoss: 0 };
    }
    if (type === 'aim')       return { heat: 0, energy: 0, speedLoss: 0 };
    if (type === 'microjump') return { heat: 55, energy: 15, speedLoss: 0 };
    if (type === 'brake') {
        var bh = templateKey === 'GX1' ? 10 : templateKey === 'HWK-290' ? 15 : 25;
        return { heat: bh, energy: 0, speedLoss: 0 };
    }
    return { heat: 0, energy: 0, speedLoss: 0 };
}

function getManeuverMinSpeed(tpl) {
    return (tpl.maneuvers && tpl.maneuvers.min_speed) ? tpl.maneuvers.min_speed : 0;
}

function canActivateManeuver(s, tpl, type) {
    var c = s.combat;
    if (!c || !c.active) return { ok: false, reason: 'нет боя' };
    if (!hasFirstPilot(s)) return { ok: false, reason: 'нет пилота' };
    if (isOverloaded(s)) return { ok: false, reason: 'перегруз' };
    if (c.maneuvers.shotThisTurn) return { ok: false, reason: 'уже стрелял' };
    if (c.maneuvers.activatedThisTurn) return { ok: false, reason: 'манёвр уже активирован' };

    if (c.turn < c.maneuvers.globalCd) return { ok: false, reason: 'глобальный КД' };
    if (c.turn < (c.maneuvers.cooldowns[type] || 0)) return { ok: false, reason: 'КД' };

    // Перегрев: только Сброс тепла доступен
    if (s.engine.overheated && type !== 'cool') return { ok: false, reason: 'перегрев' };

    // Порог скорости: Уклонение / Бочка / Торможение
    if (type === 'evade' || type === 'barrel' || type === 'brake') {
        var minSp = getManeuverMinSpeed(tpl);
        if ((s.engine.speed || 0) < minSp) return { ok: false, reason: 'мало скорости' };
    }

    // Стоимости
    var cost = getManeuverCost(s.template, type);
    if (cost.energy > 0 && s.resources.energy < cost.energy) return { ok: false, reason: 'мало энергии' };

    return { ok: true };
}

function activateManeuver(type) {
    var s = getState();
    if (!s || !s.combat || !s.combat.active) return;
    var tpl = TEMPLATES[s.template];
    var chk = canActivateManeuver(s, tpl, type);
    if (!chk.ok) return;

    var c = s.combat;
    var cost = getManeuverCost(s.template, type);
    var now = Date.now();

    // Списываем энергию / тепло
    if (cost.energy > 0) s.resources.energy = roundEnergy(Math.max(0, s.resources.energy - cost.energy));
    if (cost.heat > 0) s.engine.heat = (s.engine.heat || 0) + cost.heat;
    if (cost.heat < 0) s.engine.heat = Math.max(0, (s.engine.heat || 0) + cost.heat);

    // Скорость
    if (cost.speedLoss > 0) {
        s.engine.speed = Math.max(0, (s.engine.speed || 0) - cost.speedLoss);
    }

    // Перегрев от тепла
    if (s.engine.heat >= 100) {
        s.engine.overheated = true;
        s.engine.reserved = 0;
        s.engine.pendingReserved = null;
        s.engine.speed = 0;
        s.engine._rushActive = false;
        s.engine._rushRemaining = 0;
        s.engine._rushAccelBonus = 0;
    }

    // Специфичные эффекты
    if (type === 'evade' || type === 'barrel') {
        c.maneuvers.active = { type: type };
    } else if (type === 'rush') {
        var bonus = s.template === 'GX1' ? 50 : s.template === 'HWK-290' ? 100 : 150;
        s.engine._rushActive = true;
        s.engine._rushRemaining = 2;
        s.engine._rushAccelBonus = bonus;
        c.maneuvers.active = { type: 'rush' };
    } else if (type === 'aim') {
        c.maneuvers.active = { type: 'aim' };
        c.maneuvers.shotThisTurn = true; // блокируем выстрелы в этом ходу
    } else if (type === 'microjump') {
        c.dist += 15000;
        c.maneuvers.active = { type: 'microjump' };
    } else if (type === 'brake') {
        var bData = { type: 'brake', turn: 1 };
        if (s.template === 'GX1') {
            s.engine.speed = Math.max(0, s.engine.speed - 750);
            c.maneuvers.brakeState = { template: 'GX1', turn: 1 };
        } else if (s.template === 'HWK-290') {
            s.engine.speed = Math.max(0, s.engine.speed - 1600);
            c.maneuvers.brakeState = { template: 'HWK-290', turn: 1 };
        } else {
            s.engine.speed = Math.max(0, s.engine.speed - 2900);
            c.maneuvers.brakeState = { template: 'Pursuer', turn: 1 };
        }
        c.maneuvers.active = bData;
    } else if (type === 'cool') {
        c.maneuvers.active = { type: 'cool' };
    }

    // Кулдауны в ХОДАХ (c.turn): свой 4, остальные +2, глобальный 2
    c.maneuvers.cooldowns[type] = c.turn + 4;
    Object.keys(c.maneuvers.cooldowns).forEach(function(k) {
        if (k === type) return;
        var existing = c.maneuvers.cooldowns[k] || 0;
        var newVal = c.turn + 2;
        if (existing < newVal) c.maneuvers.cooldowns[k] = newVal;
    });
    c.maneuvers.globalCd = c.turn + 2;

    c.maneuvers.activatedThisTurn = true;

    addCombatLog(s, MANEUVER_LABELS[type] + ' активирован');
    saveState(s);
    render();
}

function calcHitChance(wpnType, target, playerLead, realDist, isEnemy) {
    var st = getWeaponStats(wpnType);
    var _state = getState();
    var _playerSpeed = (_state && _state.engine) ? (_state.engine.speed || 0) : 0;
    var _c = _state && _state.combat;
    var _man = _c ? _c.maneuvers : null;

    // Evasion от скорости
    var evasion = 0;
    if (isEnemy) {
        evasion = Math.round((target.speed || 0) / 1000);
    } else {
        var _eb = (target.baseSpeed !== undefined && target.baseSpeed !== null)
            ? target.baseSpeed : (target.speed || 0);
        evasion = Math.round((_eb - _playerSpeed) / 1000);
    }
    if (evasion < 0) evasion = 0;

    // Штрафы манёвров
    // isEnemy === true  → враг стреляет по игроку → штраф врагу от Уклонения/Бочки/Торможения
    // isEnemy === false → игрок стреляет по врагу  → штраф игроку от Уклонения + бонус от Прицеливания
    var maneuverPenalty = 0; // положительное = хуже для стрелка
    var isRocketOrTorpedo = (wpnType === 'Ракетная пусковая установка'
                          || wpnType === 'Лёгкий протонный торпедный аппарат');

    if (_man) {
        if (isEnemy) {
            // Враг → игрок. Применяем активный манёвр защиты.
            if (_man.active && _man.active.type === 'evade') {
                var _tpl = TEMPLATES[_state.template];
                var _manVal = (_state.ttx && _state.ttx.maneuver !== undefined) ? _state.ttx.maneuver : (_tpl.ttx.maneuver || 0);
                maneuverPenalty += _manVal; // −maneuver п.п. к врагу
            }
            if (_man.active && _man.active.type === 'barrel') {
                maneuverPenalty += isRocketOrTorpedo ? 50 : 15;
            }
            if (_man.active && _man.active.type === 'microjump') {
                maneuverPenalty += 15; // +15 п.п. к врагу
            }
            if (_man.brakeState) {
                // Торможение: 1-й ход / 2-й ход
                var _bs = _man.brakeState;
                var _t = _bs.turn || 1;
                if (isRocketOrTorpedo) {
                    maneuverPenalty += 15;
                } else {
                    if (_bs.template === 'GX1') {
                        maneuverPenalty += (_t === 1 ? 10 : 5);
                    } else if (_bs.template === 'HWK-290') {
                        maneuverPenalty += (_t === 1 ? 15 : 5);
                    } else {
                        maneuverPenalty += 40;
                    }
                }
            }
        } else {
            // Игрок → враг. Штраф от Уклонения (−20), бонус от Прицеливания (+9 в след. ходу).
            if (_man.active && _man.active.type === 'evade') {
                maneuverPenalty += 20; // штраф игроку −20 п.п.
            }
            if (_man.active && _man.active.type === 'aim') {
                // Прицеливание блокирует выстрелы — сюда не дойдёт
            }
            if (_man.aimNextTurn) {
                maneuverPenalty -= 9; // бонус +9 п.п.
            }
        }
    }

    // Ракета
    if (wpnType === 'Ракетная пусковая установка') {
        var _baseR = Math.max(5, Math.round(100 - target.maneuver * 1.5));
        _baseR -= evasion;
        if (!isEnemy) _baseR -= maneuverPenalty;
        else          _baseR -= maneuverPenalty;
        // Стоп: для ракеты при isEnemy=true maneuverPenalty положительное (штраф врагу), значит _baseR - penalty.
        // А для isEnemy=false при Прицеливании penalty = -9 (бонус), значит _baseR - (-9) = _baseR + 9. Верно.
        // Для isEnemy=false без манёвров penalty = 0.

        // Стоим — бонус врагу
        if (isEnemy && _playerSpeed < 1) _baseR += 15;
        if (_baseR < 1) _baseR = 1;
        return _baseR;
    }

    // Торпеда
    if (wpnType === 'Лёгкий протонный торпедный аппарат') {
        var _clsT = getEnemySizeClass(target.size);
        var _baseT = (_clsT === 'fighter') ? 1 : (_clsT === 'light' ? 25 : 75);
        _baseT -= evasion;
        _baseT -= maneuverPenalty;
        if (isEnemy && _playerSpeed < 1) _baseT += 15;
        if (_baseT < 1) _baseT = 1;
        return _baseT;
    }

    // Обычное оружие
    var realLead = calcLead(target.speed, realDist);
    var err = isEnemy ? 0 : Math.abs(playerLead - realLead);
    var leadAcc = getLeadMultiplier(err);
    if (leadAcc === 0) return 0;

    var sizeMod = target.size * ((target.maneuver / 100) * 3 + 1);
    var chance = (leadAcc * st.accuracy_coef) / sizeMod * 100;

    var cls2 = getEnemySizeClass(target.size);
    var bonus = (st.size_bonus && st.size_bonus[cls2]) || 0;
    chance += bonus;

    chance -= evasion;
    chance -= maneuverPenalty;

    // Стоим — бонус врагу
    if (isEnemy && _playerSpeed < 1) chance += 5;

    if (chance > 100) chance = 100;
    if (chance < 1) chance = 1;
    return Math.round(chance);
}

function applyDamageToEnemy(enemy, wpnType) {
    var st = getWeaponStats(wpnType);

    if (wpnType === 'Лёгкий протонный торпедный аппарат') {
        enemy.hp -= st.damage_hull;
        return { hull: st.damage_hull, shield: 0 };
    }

    if (wpnType === 'Ракетная пусковая установка') {
        if (enemy.shields > 0) {
            var absorbed = Math.min(enemy.shields, st.damage_shield);
            enemy.shields -= absorbed;
            if (enemy.shields > 0) {
                enemy.hp -= 10;
                return { hull: 10, shield: absorbed };
            }
            enemy.hp -= st.damage_hull;
            return { hull: st.damage_hull, shield: absorbed };
        }
        enemy.hp -= st.damage_hull;
        return { hull: st.damage_hull, shield: 0 };
    }

    if (enemy.shields > 0) {
        var a = Math.min(enemy.shields, st.damage_shield);
        enemy.shields -= a;
        if (enemy.shields > 0) {
            return { hull: 0, shield: a };
        }
        enemy.hp -= st.damage_hull;
        return { hull: st.damage_hull, shield: a };
    }
    enemy.hp -= st.damage_hull;
    return { hull: st.damage_hull, shield: 0 };
}

function applyDamageToPlayer(s, wpnType) {
    var st = getWeaponStats(wpnType);
    var res = { hull: 0, shield: 0 };

    if (wpnType === 'Лёгкий протонный торпедный аппарат') {
        s.resources.hull = Math.max(0, s.resources.hull - st.damage_hull);
        res.hull = st.damage_hull;
    } else if (wpnType === 'Ракетная пусковая установка') {
        if (s.resources.shields > 0) {
            var a = Math.min(s.resources.shields, st.damage_shield);
            s.resources.shields -= a;
            res.shield = a;
            if (s.resources.shields > 0) {
                s.resources.hull = Math.max(0, s.resources.hull - 10);
                res.hull = 10;
            } else {
                s.resources.hull = Math.max(0, s.resources.hull - st.damage_hull);
                res.hull = st.damage_hull;
            }
        } else {
            s.resources.hull = Math.max(0, s.resources.hull - st.damage_hull);
            res.hull = st.damage_hull;
        }
    } else {
        if (s.resources.shields > 0) {
            var a2 = Math.min(s.resources.shields, st.damage_shield);
            s.resources.shields -= a2;
            res.shield = a2;
            if (s.resources.shields === 0) {
                s.resources.hull = Math.max(0, s.resources.hull - st.damage_hull);
                res.hull = st.damage_hull;
            }
        } else {
            s.resources.hull = Math.max(0, s.resources.hull - st.damage_hull);
            res.hull = st.damage_hull;
        }
    }

    if (s.resources.hull <= 0) s.destroyed = true;
    return res;
}


function endCombat(s, reason) {
    if (!s || !s.combat) return;
    s.combat.active = false;
    if (reason) addCombatLog(s, reason);
    if (!s.destroyed) checkCritThresholds(s);
    s.combat = null;
    if (s.engine) {
        s.engine._rushActive = false;
        s.engine._rushRemaining = 0;
        s.engine._rushAccelBonus = 0;
    }
    if (_combatTimer) { clearInterval(_combatTimer); _combatTimer = null; }
    saveState(s);
    render();
}

function addCombatLog(s, text) {

    s.combat.log.push({ text: text, turn: s.combat.turn || 0 });

}


function hasFirstPilot(s) { return !!(s.crew && s.crew[0]); }
function hasSecondPilot(s) { return !!(s.crew && s.crew[1]); }

function getCrewControl(s) {
    var tpl = TEMPLATES[s.template];
    return (tpl && tpl.crew_control) ? tpl.crew_control : null;
}

function getShieldCrew(s) {
    var tpl = TEMPLATES[s.template];
    return (tpl && tpl.shield_crew !== undefined) ? tpl.shield_crew : 1;
}

function hasAnyGunner(s) {
    var cc = getCrewControl(s);
    if (!cc) return hasSecondPilot(s);
    for (var idx in cc) {
        if (s.crew && s.crew[parseInt(idx)]) return true;
    }
    return false;
}

function canControlWeapon(s, wpnType) {
    var cc = getCrewControl(s);
    if (!cc) return hasSecondPilot(s);
    for (var idx in cc) {
        if (cc[idx].indexOf(wpnType) !== -1) {
            return !!(s.crew && s.crew[parseInt(idx)]);
        }
    }
    return false;
}

function hasShieldControl(s) {
    var shc = getShieldCrew(s);
    return !!(s.crew && s.crew[shc]);
}
function isOverloaded(s) {
    return (s.resources.cargo || 0) > s.ttx.cargo_cap + 0.0001;
}

// Параметры двигателя — из таблицы engine_table
function getEngineParams(tpl, reserved, s) {
    var et = tpl.engine_table;
    if (!et || !et.entries || et.entries.length === 0) {
        return { speedTarget: 0, accel: 0, heatRate: 0 };
    }
    var idx = Math.max(0, Math.floor(reserved || 0));
    if (idx >= et.entries.length) idx = et.entries.length - 1;
    var e = et.entries[idx];

    var ttx = (s && s.ttx) ? s.ttx : tpl.ttx;
    var speed, accel;

    // speed: percentage-формат или абсолютный
    if (e.speed_pct !== undefined) {
        if (e.speed_mode === 'avg') {
            speed = (e.speed_pct / 100) * ttx.avg_space;
        } else if (e.speed_mode === 'diff') {
            speed = ttx.avg_space + (e.speed_pct / 100) * (ttx.max_space - ttx.avg_space);
        } else {
            speed = (e.speed_pct / 100) * ttx.max_space;
        }
    } else {
        speed = e.speed;
    }

    // accel: percentage-формат или абсолютный
    if (e.accel_pct !== undefined) {
        accel = (e.accel_pct / 100) * ttx.accel;
    } else {
        accel = e.accel;
    }

    return { speedTarget: speed, accel: accel, heatRate: e.heat };
}

// Цветовая зона (только для UI, не для механики)
function getEngineColorZone(tpl, reserved) {
    var em = tpl.engine_modes || { min: 1, orange_max: 1, yellow_max: 2, green_max: 3 };
    if (!reserved || reserved < em.min) return 'off';
    if (reserved <= em.orange_max) return 'orange';
    if (reserved <= em.yellow_max) return 'yellow';
    if (reserved <= em.green_max) return 'green';
    return 'blue';
}

function combatActivateWeapons() {
    var s = getState();
    if (!s || !s.combat || !s.combat.active) return;
    var c = s.combat;
    if (s.weaponsActive) return;
    if (c.weaponsActivationTurnsLeft > 0) return;
    if (!s.weapons || s.weapons.length === 0) return;
    if (s.damage && s.damage.weapons) {
        addCombatLog(s, "⚔️ Вооружение повреждено — требуется ремонт");
        saveState(s);
        render();
        return;
    }

    var extraTurn = 0;

    // Проверяем, есть ли хоть один стрелок (и есть ли пустые места стрелков)
    var emptySeats = findEmptyGunnerSeats(s);
    if (emptySeats.length > 0) {
        // Есть незанятые места стрелков — пробуем автозаполнить из пассажиров
        var hasPax = (s.passengers || []).some(Boolean);
        if (!hasPax) {
            // Стрелков нет И пассажиров нет → отказ (только если ни одного стрелка вообще)
            if (!hasAnyGunner(s)) {
                addCombatLog(s, "🚫 Оружие: нет стрелков и пассажиров");
                saveState(s);
                render();
                return;
            }
            // Иначе: хотя бы 1 стрелок есть, активируем частично без штрафа
        } else {
            // Заполняем все пустые места стрелков пассажирами
            var seatsFilled = 0;
            for (var i = 0; i < emptySeats.length; i++) {
                var paxIdx = (s.passengers || []).findIndex(Boolean);
                if (paxIdx < 0) break;
                s.crew[emptySeats[i]] = s.passengers[paxIdx];
                s.passengers[paxIdx] = null;
                seatsFilled++;
            }
            if (seatsFilled > 0) {
                extraTurn = 1;
                addCombatLog(s, "👤 Пассажир(ы) посажен(ы) за орудие (+1 х.)");
            }
        }
    }

    var cost = s.weapons.length;
    s.resources.energy = Math.max(0, roundEnergy(s.resources.energy - cost));
    c.weaponsActivationTurnsLeft = 2 + extraTurn;

    addCombatLog(s, "🔫 Активация оружия (-" + cost + "⚡, " + (2 + extraTurn) + " х.)");
    saveState(s);
    render();
}

function findEmptyGunnerSeats(s) {
    var cc = getCrewControl(s);
    var result = [];
    if (cc) {
        var keys = Object.keys(cc).map(function(k){ return parseInt(k, 10); }).sort(function(a,b){return a-b;});
        for (var i = 0; i < keys.length; i++) {
            if (!s.crew[keys[i]]) result.push(keys[i]);
        }
        return result;
    }
    // Нет crew_control — второй слот (индекс 1) это стрелок
    if (s.crew.length > 1 && !s.crew[1]) result.push(1);
    return result;
}

function combatActivateShields(mode) {
    var s = getState();
    if (!s || !s.combat || !s.combat.active) return;
    var c = s.combat;
    if (c.shieldsRaiseUsed) return;
    if (c.shieldsActivationTurnsLeft > 0) return;
    if (s.resources.shields > 0) return;

    var tpl = TEMPLATES[s.template];
    var modes = tpl.shield_modes || {};
    var m = modes[mode];
    if (!m) return;

    var cost = m.energy;
    var value = m.shields;

    s.resources.energy = Math.max(0, roundEnergy(s.resources.energy - cost));
    c.shieldsActivationTurnsLeft = 4;
    c.shieldsPendingShields = value;
    c.shieldsRaiseUsed = true;

    addCombatLog(s, "💠 Активация щитов (-" + cost + "⚡, 4 х., +" + value + "💠)");
    saveState(s);
    render();
}

            if (delayTurns === 0) {

            saveState(s);

    }
        document.querySelectorAll('[data-maneuver]').forEach(function(el) {

}

function startCombatAutoTimer() {

            if (_combatTimer) { clearInterval(_combatTimer); _combatTimer = null; }
            return;
        }
        var el = document.getElementById('combatAutoTurnTimer');
        if (el) {
            var sec = Math.max(0, Math.ceil((s.combat.autoTurnAt - Date.now()) / 1000));
            el.textContent = 'Следующий ход через: ' + sec + 'с';
        }
        if (Date.now() >= s.combat.autoTurnAt) {
            clearInterval(_combatTimer);
            _combatTimer = null;
            var inp = document.getElementById('combatLeadInput');
            if (inp) s.combat.playerLead = inp.value;
            combatTurn();
        }
    }, 1000);
}

            if (!s2) return;
            if (!s2.engine) s2.engine = { reserved: 0, speed: 0, pendingReserved: null, pendingApplyAt: 0 };
            if (s2.engine.overheated) {
                engInp.value = s2.engine.pendingReserved !== null ? s2.engine.pendingReserved : s2.engine.reserved;
                return;
            }
            if (s2.damage && s2.damage.engine_critical) {
                engInp.value = s2.engine.pendingReserved !== null ? s2.engine.pendingReserved : s2.engine.reserved;
                return;
            }
            var available2 = s2.resources.energy + s2.engine.reserved;
            var oldFree = s2.resources.energy;
            var v = parseFloat(engInp.value);
            if (isNaN(v) || v < 0) v = 0;
            v = Math.round(v);
            if (v > available2) v = available2;

            // Сброс в 0 — мгновенно (стоп-кран)
            if (v === 0) {
                var oldReserved = s2.engine.reserved;
                s2.engine.reserved = 0;
                s2.engine.pendingReserved = null;
                s2.engine.pendingApplyAt = 0;
                s2.resources.energy += oldReserved;
                saveState(s2);
                render();
                return;
            }

            // Обрезка по available — обновить инпут, если игрок ввёл больше
            if (v > available2) {
                v = available2;
                engInp.value = v;
            }

            // Проверка DEAD: если после применения free станет 0
            var newFree = available2 - v;
            if (newFree === 0 && v > 0) {
                pendingReboot = true;
                engInp.value = s2.engine.reserved;
                s2.engine.pendingReserved = null;
                s2.engine.pendingApplyAt = 0;
                showAlert('dead');
                return;
            }

            // Обычное изменение — задержка 3–6 сек
            var et = tpl.engine_table;
            var dmin = (et && et.delay_min) || 3;
            var dmax = (et && et.delay_max) || 6;
            var delay = dmin + Math.random() * (dmax - dmin);

            s2.engine.pendingReserved = v;
            s2.engine.pendingApplyAt = Date.now() + delay * 1000;

            // WARN при пересечении порога (сработает в момент применения)
            if (oldFree >= tpl.crit_energy && newFree < tpl.crit_energy && newFree > 0) {
                setTimeout(function() { showAlert('warn'); }, delay * 1000);
            }

            saveState(s2);
            // НЕ render — инпут уже показывает введённое значение,
            // состояние применится через engineTick
        });
    }

    // Кнопки у полей
    ['energy','hull','shields','fuel','cargo'].forEach(function(k) {
        var btn = document.getElementById('resBtn_' + k);
        if (!btn) return;
        btn.addEventListener('click', function() { openResourceModal(k, s, tpl); });
    });

    // Допуски
    var addCodeBtn = document.getElementById('shipAddCode');
    if (addCodeBtn) {

    // Бой (тест)
